<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CTRC — Báo cáo per-buổi · WonderKids</title>
<meta name="description" content="Hệ thống báo cáo học tập per-buổi: GV chấm → AI viết → CSKH duyệt → phụ huynh xem.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='%23ffc24a'/><stop offset='1' stop-color='%23e94e1b'/></linearGradient></defs><circle cx='32' cy='32' r='30' fill='url(%23g)'/><text x='32' y='42' font-family='Arial' font-size='22' font-weight='900' fill='%23fff' text-anchor='middle'>CT</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --font:'Be Vietnam Pro',system-ui,sans-serif;
  --font-d:'Baloo 2','Be Vietnam Pro',system-ui,sans-serif;
  --primary:#f3811f; --primary-2:#e94e1b; --yellow:#f5b223;
  --green:#5fb53f; --blue:#4a8cc4; --ink:#3a2e22; --ink-soft:#6b5a48; --mute:#a4886a;
  --cream:#fff7ec; --cream-2:#fdeede; --card:#fffdf9; --line:#f0e0cc; --line-soft:#f6ebda;
  --pill:#fff1dd; --shadow:0 4px 18px rgba(233,78,27,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:var(--font);color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
.hidden{display:none !important}

/* ── Top bar ── */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;
  padding:10px 18px;background:rgba(255,253,249,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.home-link{display:inline-flex;align-items:center;gap:5px;text-decoration:none;color:var(--ink-soft);
  font:700 12px/1 var(--font);padding:7px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;white-space:nowrap}
.home-link:hover{border-color:var(--primary);color:var(--primary-2)}
.brand{display:flex;align-items:center;gap:10px;font:800 17px/1 var(--font-d);color:var(--primary-2);text-decoration:none}
.demo-banner a{color:#8a5a00;font-weight:800;text-decoration:underline;cursor:pointer}
.brand .logo{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffc24a,var(--primary) 65%,var(--primary-2));
  display:flex;align-items:center;justify-content:center;color:#fff;font:800 13px/1 var(--font-d)}
.brand .sub{font:600 10px/1 var(--font);color:var(--mute);letter-spacing:.05em}
.nav{display:flex;gap:4px;margin-left:8px;flex-wrap:wrap}
.nav button{padding:7px 13px;border:1px solid transparent;background:transparent;border-radius:9px;
  font:700 12.5px/1 var(--font);color:var(--ink-soft)}
.nav button:hover{background:var(--pill);color:var(--primary-2)}
.nav button.active{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff}
.spacer{flex:1}
.topbar-gear{border:1px solid var(--line);background:#fff;color:var(--ink-soft);font:700 12px/1 var(--font);
  padding:7px 11px;border-radius:9px;margin-right:8px;white-space:nowrap}
.topbar-gear:hover{border-color:var(--primary);color:var(--primary-2)}
.userchip{display:flex;align-items:center;gap:2px;background:var(--cream);border:1px solid var(--line);
  padding:3px 4px 3px 4px;border-radius:99px;font:700 12px/1 var(--font)}
.userchip .uc-switch{display:flex;align-items:center;gap:8px;border:none;background:transparent;
  padding:4px 8px;border-radius:99px;font:inherit;color:var(--ink)}
.userchip .uc-switch:hover{background:#fff}
.userchip .uc-switch .caret{color:var(--mute);font-size:10px}
.userchip .role{font:700 9.5px/1 var(--font);text-transform:uppercase;letter-spacing:.06em;color:#fff;
  padding:4px 8px;border-radius:99px;background:var(--mute)}
.userchip .role.gv{background:var(--green)} .userchip .role.cskh{background:var(--blue)} .userchip .role.manager{background:var(--primary)}
.userchip .uc-logout{border:none;background:transparent;color:var(--mute);font-size:15px;padding:4px 8px;border-radius:99px}
.userchip .uc-logout:hover{background:#fff;color:var(--primary-2)}

/* dropdown đổi tài khoản */
.account-menu{position:fixed;inset:0;z-index:300}
.account-menu.hidden{display:none}
.account-menu .am-bg{position:absolute;inset:0}
.account-menu .am-panel{position:absolute;background:var(--card);border:1px solid var(--line);
  border-radius:14px;box-shadow:0 14px 40px rgba(60,30,10,.22);padding:7px;min-width:248px}
.am-head{font:700 9.5px/1 var(--font);text-transform:uppercase;letter-spacing:.06em;color:var(--mute);padding:8px 10px 6px}
.am-item{display:flex;align-items:center;gap:10px;width:100%;border:none;background:transparent;
  padding:9px 10px;border-radius:10px;text-align:left;font:inherit}
.am-item:hover{background:var(--pill)}
.am-item.cur{background:var(--cream-2)}
.am-item .am-nm{flex:1;font:700 13px/1.2 var(--font);color:var(--ink)}
.am-item .am-nm small{display:block;font:500 10.5px/1.3 var(--font);color:var(--mute);margin-top:2px}
.demo-banner{background:linear-gradient(90deg,#fff3cd,#ffe9b8);color:#8a6d1a;text-align:center;
  font:600 11.5px/1.4 var(--font);padding:6px 12px;border-bottom:1px solid #f0d98a}

/* ── Layout ── */
.wrap{max-width:1080px;margin:0 auto;padding:18px}
.h-title{font:800 19px/1.2 var(--font-d);color:var(--primary-2);margin:0 0 3px}
.h-sub{font:500 12.5px/1.5 var(--font);color:var(--ink-soft);margin:0 0 16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font:700 10px/1 var(--font);text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.field input,.field select,.input{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font:500 13px/1.2 var(--font);color:var(--ink)}
.input:focus,.field input:focus,.field select:focus{outline:2px solid var(--primary);border-color:var(--primary)}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.btn{padding:10px 16px;border-radius:11px;border:1px solid var(--line);background:#fff;font:700 13px/1 var(--font);color:var(--ink-soft)}
.btn:hover{border-color:var(--primary);color:var(--primary-2)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border:none}
.btn.primary:hover{box-shadow:0 6px 16px rgba(233,78,27,.3);transform:translateY(-1px)}
.btn.green{background:var(--green);color:#fff;border:none}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:7px 11px;font-size:12px}

/* ── Roster ── */
.roster{display:grid;gap:8px;margin-top:14px}
.stu-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:13px;cursor:pointer;transition:.15s}
.stu-row:hover{border-color:var(--primary);box-shadow:var(--shadow)}
.stu-row .av{width:40px;height:40px;border-radius:50%;background:var(--cream-2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.stu-row .nm{font:700 14px/1.2 var(--font);flex:1}
.stu-row .nm small{display:block;font:500 11px/1.3 var(--font);color:var(--mute);margin-top:2px}
.badge{font:700 10px/1 var(--font);padding:5px 10px;border-radius:99px;white-space:nowrap}
.b-wait{background:#fff1dd;color:#c0691a} .b-cs{background:#e3f0fb;color:#2f6ea0}
.b-ok{background:#eaf7e0;color:#46901f} .b-sent{background:#e7f5ea;color:#2f8a4e}
.b-absent{background:#f0e9e2;color:#8a7763} .b-err{background:#fde6dd;color:#c5421c} .b-edit{background:#fbeccf;color:#9a7415}

/* ── Score form ── */
.dim{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line-soft)}
.dim .dl{font:700 13px/1 var(--font);flex:1}
.scale{display:flex;gap:5px}
.scale button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;font:700 13px/1 var(--font);color:var(--ink-soft)}
.scale button.on{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;border:none}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.chip{padding:7px 12px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font:600 12px/1.2 var(--font);color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.chip .warn{color:var(--yellow);font-weight:800}
.chip.on .warn{color:#fff}
textarea.input{width:100%;min-height:64px;resize:vertical;line-height:1.5}
.gold{border:1.5px solid var(--yellow);background:#fffdf3}
.hint{font:500 11px/1.4 var(--font);color:var(--mute);margin-top:4px}

/* ── CSKH editor ── */
.editor{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.editor{grid-template-columns:1fr}}
.draft-box{background:var(--cream);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font:500 12.5px/1.6 var(--font);color:var(--ink-soft)}
.draft-box b{color:var(--primary-2)}
.ln{margin-bottom:12px}
.ln label{font:700 11px/1 var(--font);text-transform:uppercase;letter-spacing:.05em;color:var(--mute);display:block;margin-bottom:5px}
.voice-warn{font:600 11px/1.4 var(--font);color:#c5421c;margin-top:4px}
.copy-block{background:#10241a;color:#d7ffe6;border-radius:12px;padding:14px;font:500 12px/1.6 'Be Vietnam Pro',monospace;white-space:pre-wrap;margin-top:10px}
.linkbox{display:flex;gap:8px;margin-top:8px;align-items:center}
.linkbox input{flex:1;font-size:11.5px;color:var(--blue)}

/* ── KPI ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .n{font:800 26px/1 var(--font-d);color:var(--primary-2)}
.kpi .l{font:600 11px/1.3 var(--font);color:var(--mute);margin-top:4px}

/* ── table ── */
table.tb{width:100%;border-collapse:collapse;font:500 12px/1.4 var(--font)}
table.tb th{text-align:left;font:700 10.5px/1 var(--font);text-transform:uppercase;color:var(--mute);padding:8px 10px;border-bottom:1px solid var(--line)}
table.tb td{padding:9px 10px;border-bottom:1px solid var(--line-soft)}

/* ── modal/toast ── */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--green);color:#fff;padding:12px 20px;border-radius:12px;font:600 13px/1.4 var(--font);
  z-index:9999;transition:.25s;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-bg{position:fixed;inset:0;background:rgba(40,25,12,.45);backdrop-filter:blur(3px);z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border-radius:18px;padding:22px;max-width:520px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:88vh;overflow:auto}
.modal h3{font:800 17px/1.2 var(--font-d);color:var(--primary-2);margin:0 0 12px}

/* ── login ── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  background:radial-gradient(circle at 30% 20%,#fff3e0,var(--cream))}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:30px;max-width:420px;width:100%;box-shadow:0 16px 48px rgba(233,78,27,.12);text-align:center}
.login-card .big-logo{width:64px;height:64px;border-radius:50%;margin:0 auto 14px;background:radial-gradient(circle at 35% 35%,#ffc24a,var(--primary) 65%,var(--primary-2));
  display:flex;align-items:center;justify-content:center;color:#fff;font:800 22px/1 var(--font-d)}
.login-card h1{font:800 22px/1.2 var(--font-d);color:var(--primary-2);margin:0 0 4px}
.login-card p{font:500 12.5px/1.5 var(--font);color:var(--ink-soft);margin:0 0 20px}
.staff-pick{display:grid;gap:9px}
.staff-pick button{display:flex;align-items:center;gap:12px;padding:13px 16px;border:1.5px solid var(--line);border-radius:13px;background:#fff;text-align:left;transition:.15s}
.staff-pick button:hover{border-color:var(--primary);box-shadow:var(--shadow)}
.staff-pick .nm{font:700 14px/1.2 var(--font);flex:1}
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="login" class="login-wrap">
  <div class="login-card">
    <div class="big-logo">CT</div>
    <h1>CTRC</h1>
    <p>Báo cáo học tập per-buổi · <span id="login-center">WonderKids</span><br>
       <span id="mode-note" style="font-size:11px;color:var(--mute)"></span></p>
    <div style="font:600 11.5px/1.4 var(--font);color:var(--mute);margin-bottom:10px">Nội bộ — chọn tên để vào, không cần mật khẩu</div>
    <div class="staff-pick" id="staff-pick"></div>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="app" class="hidden">
  <div id="demo-banner" class="demo-banner hidden">⚡ Chế độ DEMO — dữ liệu lưu tạm trên <b>máy này</b>, vẫn dùng tốt cho 1 máy. <a href="#" onclick="CTRC.helpSupabase();return false;">Kết nối nhiều máy? →</a></div>
  <div class="topbar">
    <a href="../index.html" class="home-link" title="Về trang chính WonderKids">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Trang chính
    </a>
    <a href="../index.html" class="brand" title="Về trang chính WonderKids">
      <span class="logo">CT</span>
      <span>CTRC<br><span class="sub" id="tb-center">WonderKids</span></span>
    </a>
    <div class="nav" id="nav"></div>
    <div class="spacer"></div>
    <button class="topbar-gear" onclick="CTRC.openAIConfig()" title="Cấu hình AI (model + API)">⚙ AI</button>
    <div class="userchip">
      <button class="uc-switch" onclick="CTRC.toggleAccountMenu(event)" title="Đổi tài khoản / vai trò">
        <span id="uc-name">—</span>
        <span class="role" id="uc-role">—</span>
        <span class="caret">▾</span>
      </button>
      <button class="uc-logout" title="Đăng xuất" onclick="CTRC.logout()">⎋</button>
    </div>
  </div>
  <div class="wrap" id="view"></div>
</div>

<div id="account-menu" class="account-menu hidden">
  <div class="am-bg" onclick="CTRC.closeAccountMenu()"></div>
  <div class="am-panel" id="am-panel"></div>
</div>

<div id="toast"></div>
<div id="modal-root"></div>

<script src="config.js?v=3"></script>
<script src="db.js?v=3"></script>
<script src="engine.js?v=3"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════════════
   CTRC — APP (UI + flows). Dùng CTRC_DB + CTRC_ENGINE.
   ═══════════════════════════════════════════════════════════════════════════ */
const DB = window.CTRC_DB, ENG = window.CTRC_ENGINE, CFG = window.CTRC_CONFIG;
const $ = (s, r = document) => r.querySelector(s);
const view = $('#view');
let CENTER = null, STAFF = null, TAB = null;

/* ── helpers ── */
function toast(msg, color) {
  const t = $('#toast'); t.textContent = msg; t.style.background = color || 'var(--green)';
  t.classList.add('show'); clearTimeout(window._tt); window._tt = setTimeout(() => t.classList.remove('show'), 2800);
}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function modal(html) {
  const root = $('#modal-root');
  root.innerHTML = `<div class="modal-bg" onclick="if(event.target===this)CTRC.closeModal()"><div class="modal">${html}</div></div>`;
}
let EDITING_MSG = null;   // id tin CSKH đang giữ lock (để nhả khi đóng)
async function closeModal(){
  const editId = EDITING_MSG; EDITING_MSG = null;
  // đọc nháp đang sửa (nếu editor còn mở) để KHÔNG mất công sửa
  let edits = null;
  if (editId && $('#m-dm')) edits = readEdits();
  $('#modal-root').innerHTML = '';
  if (editId){
    try {
      const cur = await DB.getMessageById(editId);
      if (cur && cur.status === 'cs_editing' && cur.lock_owner === STAFF.id){
        const patch = { status:'waiting_cs', lock_owner:null, lock_at:null };
        if (edits && (edits.diem_manh || edits.co_gang || edits.goi_y)) Object.assign(patch, edits);
        await DB.updateMessageGuarded(editId, cur.version, patch);  // nhả lock + lưu nháp
      }
    } catch(_){}
    if ($('#q-list')) loadQueue();
  }
}
/* Giải thích "điền Supabase là gì" */
function helpSupabase(){
  modal(`<h3>🔗 Kết nối nhiều máy (Supabase)</h3>
    <p class="h-sub">Bản DEMO lưu dữ liệu trên <b>chính máy này</b> nên GV (điện thoại) và CSKH (máy tính) <b>không thấy chung</b>. Muốn dùng chung, cần một "kho dữ liệu" miễn phí tên <b>Supabase</b>. Làm 1 lần, ~10 phút:</p>
    <ol style="font:500 12.5px/1.7 var(--font);color:var(--ink-soft);padding-left:18px;margin:0 0 12px">
      <li>Vào <b>supabase.com</b> → tạo project miễn phí.</li>
      <li>Mở <b>SQL Editor</b> → dán nội dung file <b>ctrc/schema.sql</b> → Run (tạo bảng + dữ liệu mẫu).</li>
      <li>Vào <b>Settings → API</b>, copy 2 thứ: <b>Project URL</b> và <b>anon public key</b>.</li>
      <li>Mở file <b>ctrc/config.js</b>, điền 2 dòng:</li>
    </ol>
    <div class="copy-block" style="margin:0">supabaseUrl:    'https://xxxx.supabase.co',
supabaseAnonKey:'eyJhbG...'  (anon public key)</div>
    <p class="hint" style="margin-top:10px">Lưu lại → mở lại app, banner sẽ đổi thành <b>🟢 Kết nối Supabase</b>. Hướng dẫn đầy đủ + bảo mật ở file <b>ctrc/SETUP.md</b>.</p>
    <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn primary" onclick="CTRC.closeModal()">Đã hiểu</button></div>`);
}
const todayStr = () => new Date().toISOString().slice(0,10);
const AV = g => g==='Nữ' ? '👧' : '👦';
const MOODS = {happy:'😊 Vui',normal:'🙂 Bình thường',sad:'😟 Buồn',tired:'😴 Mệt'};
const STATUS = {
  waiting_gv:['Chờ GV','b-wait'], ai_writing:['AI đang viết','b-wait'],
  waiting_cs:['Chờ CS duyệt','b-cs'], cs_editing:['CS đang sửa','b-edit'],
  approved:['Đã duyệt','b-ok'], sent:['Đã gửi PH','b-sent'], error:['Lỗi — xem lại','b-err'],
};

/* ── parent link ── */
function parentBase(){
  if (CFG.parentBaseUrl) return CFG.parentBaseUrl;
  const dir = location.href.replace(/[^/]*$/,'');
  return dir + 'parent.html';
}

/* ═══════════════ AI — cấu hình + client (edge / trực tiếp) ═══════════════ */
const AI_SYSTEM = [
  'Bạn là trợ lý viết báo cáo cho giáo viên mầm non WonderKids. Giọng văn:',
  '- LUÔN cụ thể hành vi, KHÔNG chung chung ("bé ngoan", "bé giỏi").',
  '- LUÔN hướng tới trước; TUYỆT ĐỐI tránh: kém, yếu, tệ, chậm, dốt, lười, hư.',
  '- KHÔNG so sánh bé này với bé khác. Tôn trọng tốc độ riêng.',
  '- Tiếng Việt tự nhiên, ấm áp; mỗi dòng 1-2 câu.',
].join('\n');
const _DIM_VI = {focus:'Tập trung',logic:'Logic',reflex:'Phản xạ',interaction:'Tương tác',creativity:'Sáng tạo'};
function buildAIPrompt(b){
  const stu=b.student||{}, rec=b.record||{}, theme=b.theme||{}, prof=b.profile||{}, strengths=b.strengths||[], center=b.center||{};
  const picked=(rec.strengths||[]).map(i=>(strengths.find(s=>s.idx===i)||{}).label).filter(Boolean);
  const scores=Object.entries(rec.scores_5d||{}).map(([k,v])=>`${_DIM_VI[k]||k}: ${v}/5`).join(', ');
  const profLine=(prof&&prof.status==='active')?`Tính cách: ${prof.introversion}; kiểu học: ${prof.learning_style}. ${prof.summary||''}`:'Chưa có hồ sơ (giọng trung tính).';
  return [
    `BỐI CẢNH: Trung tâm ${center.name||'WonderKids'}. Tuần này lớp học chủ đề "${theme.title||'(chưa có)'}".`,
    `HỒ SƠ BÉ ${stu.name}: ${profLine}`,
    `HÔM NAY GV chấm: ${scores||'(chưa chấm)'}. Điểm mạnh tick: ${picked.join(', ')||'(không)'}.`,
    `QUAN SÁT CỤ THỂ (lõi, quan trọng nhất): "${rec.observation||'(trống)'}".`,
    rec.effort?`Ghi chú cố gắng: "${rec.effort}".`:'',
    '',
    `Viết báo cáo gửi phụ huynh bé ${stu.name} gồm ĐÚNG 3 dòng (mỗi dòng 1-2 câu, ấm áp):`,
    `1. Điểm mạnh hôm nay (cụ thể hành vi, dựa trên quan sát GV)`,
    `2. Điểm cố gắng (bé thử gì dù chưa hoàn hảo)`,
    `3. Gợi ý ở nhà (5-10 phút, không cần mua đồ)`,
    `Trả về DUY NHẤT JSON: {"diem_manh":"...","co_gang":"...","goi_y":"..."} — không thêm chữ nào khác.`,
  ].filter(Boolean).join('\n');
}

const AI = {
  KEY:'ctrc:ai:v1',
  DEFAULT_MODELS:[
    {id:'claude-opus-4-1',        name:'Claude Opus 4.1 — mạnh nhất'},
    {id:'claude-sonnet-4-5',      name:'Claude Sonnet 4.5 — cân bằng (khuyên dùng)'},
    {id:'claude-3-5-haiku-latest',name:'Claude Haiku 3.5 — nhanh, tiết kiệm'},
  ],
  get(){
    const base = Object.assign({
      provider:'anthropic', mode: (CFG.edgeFnUrl?'edge':'edge'),
      edgeFnUrl: CFG.edgeFnUrl||'', apiKey:'', model:'claude-sonnet-4-5',
      maxTokens:600, baseUrl:'https://api.anthropic.com', models:this.DEFAULT_MODELS.slice(),
    }, (CFG.ai||{}));
    let saved={}; try{ saved=JSON.parse(localStorage.getItem(this.KEY))||{}; }catch(_){}
    return Object.assign(base, saved);
  },
  save(cfg){ try{ localStorage.setItem(this.KEY, JSON.stringify(cfg)); }catch(e){ toast('Lưu cấu hình lỗi','var(--primary-2)'); } },
  usable(){ const c=this.get(); return c.mode==='edge' ? !!c.edgeFnUrl : !!c.apiKey; },
  _directHeaders(c){ return {'content-type':'application/json','x-api-key':c.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}; },
  async listModels(cfg){
    const c=cfg||this.get();
    if(c.mode==='edge'){
      if(!c.edgeFnUrl) throw new Error('Chưa có Edge Function URL');
      const r=await fetch(c.edgeFnUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'list_models'})});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const d=await r.json(); return (d.data||d.models||[]).map(m=>({id:m.id,name:m.display_name||m.id}));
    }
    if(!c.apiKey) throw new Error('Chưa có API key');
    const r=await fetch(c.baseUrl+'/v1/models?limit=100',{headers:this._directHeaders(c)});
    if(!r.ok) throw new Error('HTTP '+r.status+': '+(await r.text()).slice(0,140));
    const d=await r.json(); return (d.data||[]).map(m=>({id:m.id,name:m.display_name||m.id}));
  },
  async generate(payload, cfg){
    const c=cfg||this.get();
    if(c.mode==='edge'){
      if(!c.edgeFnUrl) throw new Error('Chưa có Edge Function URL');
      const r=await fetch(c.edgeFnUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({model:c.model,max_tokens:c.maxTokens},payload))});
      if(!r.ok) throw new Error('Edge HTTP '+r.status);
      return r.json();
    }
    if(!c.apiKey) throw new Error('Chưa có API key');
    const r=await fetch(c.baseUrl+'/v1/messages',{method:'POST',headers:this._directHeaders(c),
      body:JSON.stringify({model:c.model,max_tokens:c.maxTokens,system:AI_SYSTEM,messages:[{role:'user',content:buildAIPrompt(payload)}]})});
    if(!r.ok) throw new Error('Anthropic HTTP '+r.status+': '+(await r.text()).slice(0,160));
    const d=await r.json(); const text=((d.content&&d.content[0]&&d.content[0].text)||'').trim();
    const m=text.match(/\{[\s\S]*\}/); let out={}; if(m){try{out=JSON.parse(m[0]);}catch(_){}}
    if(!out.diem_manh) out={diem_manh:text,co_gang:'',goi_y:''};
    return out;
  },
  /* gọi Claude tổng quát (cho Insights + trợ lý GV). Trả về text. */
  async complete(system, prompt, cfg){
    const c=cfg||this.get();
    if(c.mode==='edge'){
      if(!c.edgeFnUrl) throw new Error('Chưa có Edge Function URL');
      const r=await fetch(c.edgeFnUrl,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action:'complete',system,prompt,model:c.model,max_tokens:c.maxTokens})});
      if(!r.ok) throw new Error('Edge HTTP '+r.status);
      const d=await r.json(); return d.text||'';
    }
    if(!c.apiKey) throw new Error('Chưa có API key');
    const r=await fetch(c.baseUrl+'/v1/messages',{method:'POST',headers:this._directHeaders(c),
      body:JSON.stringify({model:c.model,max_tokens:c.maxTokens,system,messages:[{role:'user',content:prompt}]})});
    if(!r.ok) throw new Error('Anthropic HTTP '+r.status+': '+(await r.text()).slice(0,160));
    const d=await r.json(); return ((d.content&&d.content[0]&&d.content[0].text)||'').trim();
  },
};

async function boot(){
  let mode = 'demo';
  try { mode = await DB.init(); }
  catch(e){ console.error(e); toast('Lỗi kết nối backend, chạy tạm demo: '+e.message,'var(--primary-2)'); }
  CENTER = await DB.getCenter();
  $('#login-center').textContent = CENTER ? CENTER.name : 'WonderKids';
  $('#tb-center').textContent = CENTER ? CENTER.name : 'WonderKids';
  $('#mode-note').textContent = mode==='supabase' ? '🟢 Kết nối Supabase' : '⚡ Demo (localStorage)';
  if (mode==='demo') $('#demo-banner').classList.remove('hidden');
  // tự dọn lock "CS đang sửa" bị kẹt (demo: tất cả; supabase: chỉ lock cũ >15')
  if (CENTER) await DB.healLocks(CENTER.id, mode==='demo');
  // session đã đăng nhập?
  const saved = sessionStorage.getItem('ctrc:staff');
  if (saved){ try { STAFF = JSON.parse(saved); enterApp(); return; } catch(_){} }
  renderLogin();
}

async function renderLogin(){
  const staff = CENTER ? await DB.listStaff(CENTER.id) : [];
  $('#staff-pick').innerHTML = staff.map(s=>{
    const r = STATUS_ROLE(s.role);
    return `<button onclick="CTRC.login('${s.id}')">
      <span style="font-size:22px">${r.emoji}</span>
      <span class="nm">${esc(s.name)}<small style="display:block;color:var(--mute);font-weight:500">${r.label}</small></span>
      <span class="role ${s.role}">${s.role}</span>
    </button>`;
  }).join('') || '<p style="color:var(--mute)">Chưa có nhân sự. Hãy chạy schema seed hoặc mở demo.</p>';
}
function STATUS_ROLE(r){
  return {gv:{emoji:'👩‍🏫',label:'Giáo viên — chấm buổi'},cskh:{emoji:'💬',label:'CSKH — duyệt & gửi'},manager:{emoji:'📊',label:'Quản lý — hồ sơ & tổng quan'}}[r]||{emoji:'👤',label:r};
}

async function login(staffId){
  const staff = await DB.listStaff(CENTER.id);
  STAFF = staff.find(s=>s.id===staffId);
  if (!STAFF) return;
  sessionStorage.setItem('ctrc:staff', JSON.stringify(STAFF));
  await DB.audit(CENTER.id, STAFF, 'login', 'staff', STAFF.id, {});
  enterApp();
}
function logout(){ sessionStorage.removeItem('ctrc:staff'); STAFF=null; location.reload(); }

function enterApp(){
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#uc-name').textContent = STAFF.name;
  const rEl = $('#uc-role'); rEl.textContent = STAFF.role; rEl.className = 'role '+STAFF.role;
  buildNav();
}

/* ── Đổi tài khoản nhanh (không cần đăng xuất) ── */
async function toggleAccountMenu(ev){
  const menu = $('#account-menu');
  if(!menu.classList.contains('hidden')){ menu.classList.add('hidden'); return; }
  const panel = $('#am-panel');
  const staff = await DB.listStaff(CENTER.id);
  panel.innerHTML = `<div class="am-head">Đổi tài khoản · test mọi vai trò</div>` + staff.map(s=>{
    const r = STATUS_ROLE(s.role), cur = s.id===STAFF.id;
    return `<button class="am-item ${cur?'cur':''}" onclick="CTRC.switchAccount('${s.id}')">
      <span style="font-size:20px">${r.emoji}</span>
      <span class="am-nm">${esc(s.name)}<small>${esc(r.label)}</small></span>
      <span class="role ${s.role}">${s.role}</span>${cur?'<span style="color:var(--green);font-weight:800;margin-left:4px">✓</span>':''}</button>`;
  }).join('');
  // đặt panel ngay dưới chip
  const chip = (ev && ev.currentTarget) ? ev.currentTarget.closest('.userchip') : document.querySelector('.userchip');
  const rect = chip.getBoundingClientRect();
  panel.style.top = (rect.bottom + 6) + 'px';
  panel.style.right = (window.innerWidth - rect.right) + 'px';
  menu.classList.remove('hidden');
}
function closeAccountMenu(){ $('#account-menu').classList.add('hidden'); }
async function switchAccount(id){
  closeAccountMenu();
  const staff = await DB.listStaff(CENTER.id);
  const next = staff.find(s=>s.id===id);
  if(!next || (STAFF && next.id===STAFF.id)) return;
  STAFF = next;
  sessionStorage.setItem('ctrc:staff', JSON.stringify(STAFF));
  await DB.audit(CENTER.id, STAFF, 'login', 'staff', STAFF.id, {via:'switch'});
  $('#uc-name').textContent = STAFF.name;
  const rEl = $('#uc-role'); rEl.textContent = STAFF.role; rEl.className = 'role '+STAFF.role;
  buildNav();
  toast('✓ Đang là '+STAFF.name+' · '+STAFF.role.toUpperCase());
}

/* ── nav theo vai trò ── */
function buildNav(){
  const tabs = {
    gv:[['cham','Chấm buổi']],
    cskh:[['queue','Hàng đợi']],
    manager:[['overview','Tổng quan'],['insights','✨ AI Insights'],['profiles','Hồ sơ bé'],['queue','Hàng đợi'],['config','Cấu hình'],['audit','Nhật ký']],
  }[STAFF.role] || [];
  $('#nav').innerHTML = tabs.map(([k,l])=>`<button data-tab="${k}" onclick="CTRC.go('${k}')">${l}</button>`).join('');
  go(tabs[0][0]);
}
function go(tab){
  TAB = tab;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  ({cham:viewCham, queue:viewQueue, overview:viewOverview, insights:viewInsights, profiles:viewProfiles, config:viewConfig, audit:viewAudit}[tab]||(()=>{}))();
}

async function loadRoster(){
  const box = $('#gv-roster'); if(!box) return;
  box.innerHTML = '<p style="color:var(--mute)">Đang tải…</p>';
  GV.students = await DB.listStudents(CENTER.id, GV.classId);
  GV.session = await DB.ensureSession(CENTER.id, GV.classId, GV.date, STAFF.id);
  const recs = await DB.listRecordsBySession(GV.session.id);
  const recMap = {}; recs.forEach(r=>recMap[r.student_id]=r);
  const rows = await Promise.all(GV.students.map(async s=>{
    const rec = recMap[s.id];
    let badge = ['Chờ chấm','b-wait'];
    if (rec){
      if (rec.attendance==='absent') badge=['Nghỉ','b-absent'];
      else { const m = await DB.getMessage(rec.id); badge = m ? STATUS[m.status] : ['Đã chấm','b-ok']; }
    }
    return `<div class="stu-row" onclick="CTRC.openScore('${s.id}')">
      <span class="av">${AV(s.gender)}</span>
      <span class="nm">${esc(s.name)}<small>${s.session_count||0} buổi · ${esc((GV.classes.find(c=>c.id===GV.classId)||{}).name||'')}</small></span>
      <span class="badge ${badge[1]}">${badge[0]}</span>
    </div>`;
  }));
  box.innerHTML = rows.join('') || '<p style="color:var(--mute)">Lớp chưa có bé nào. Thêm ở tab Cấu hình (Manager).</p>';
}

let SCORE = null;
async function openScore(studentId){
  const stu = await DB.getStudent(studentId);
  const rec = await DB.getRecord(GV.session.id, studentId) || { scores_5d:{}, strengths:[], observation:'', effort:'', mood:'normal', attendance:'present' };
  const strengths = await DB.listStrengths(CENTER.id);
  const recent = new Set(await DB.recentFeaturedStrengths(studentId, 5));
  SCORE = { stu, rec: JSON.parse(JSON.stringify(rec)), strengths, recent };
  renderScore();
}
function renderScore(){
  const {stu, rec, strengths, recent} = SCORE;
  const dimRows = ENG.DIMS.map(d=>`
    <div class="dim"><span class="dl">${d.label}</span>
      <span class="scale">${[1,2,3,4,5].map(n=>`<button class="${(+rec.scores_5d[d.key])===n?'on':''}" onclick="CTRC.setScore('${d.key}',${n})">${n}</button>`).join('')}</span>
    </div>`).join('');
  const chips = strengths.map(s=>{
    const on = (rec.strengths||[]).includes(s.idx);
    const warn = recent.has(s.idx);
    return `<button class="chip ${on?'on':''}" onclick="CTRC.toggleStrength(${s.idx})" title="${warn?'Đã nêu gần đây — ưu tiên điểm khác nếu hợp lý':''}">
      ${warn?'<span class="warn">↻</span>':''}${esc(s.label)}</button>`;
  }).join('');
  const absent = rec.attendance==='absent';
  modal(`
    <h3>${AV(stu.gender)} ${esc(stu.name)}</h3>
    <div class="row" style="margin-bottom:14px">
      <button class="btn sm ${!absent?'green':''}" onclick="CTRC.setAttendance('present')">Đi học</button>
      <button class="btn sm ${absent?'primary':''}" onclick="CTRC.setAttendance('absent')">Nghỉ</button>
    </div>
    <div id="score-body" class="${absent?'hidden':''}">
      <div style="margin-bottom:8px">${dimRows}</div>
      <label style="font:700 11px/1 var(--font);text-transform:uppercase;letter-spacing:.05em;color:var(--mute)">Điểm mạnh hôm nay (tick 1-3)</label>
      <div class="chips" style="margin-bottom:12px">${chips}</div>
      <div class="ln">
        <label style="color:#b8860b">⭐ Quan sát cụ thể (QUAN TRỌNG NHẤT)</label>
        <textarea class="input gold" id="sc-obs" placeholder="VD: Bé tự ghép đúng 5 mảnh, kiên nhẫn thử lại 3 lần khi sai">${esc(rec.observation)}</textarea>
        <div class="row" style="margin-top:6px;gap:8px">
          <button class="btn sm" type="button" onclick="CTRC.gvSuggest()">✨ Gợi ý từ quan sát</button>
          <span class="hint" style="margin:0">Càng cụ thể → tin càng "đắt". Tránh viết chung như "bé ngoan".</span>
        </div>
        <div id="sc-suggest"></div>
      </div>
      <div class="ln"><label>Điểm cố gắng (tuỳ chọn)</label>
        <textarea class="input" id="sc-effort" placeholder="VD: tập đếm to thành tiếng dù còn ngại">${esc(rec.effort)}</textarea></div>
      <div class="field" style="margin-bottom:14px"><label>Tâm trạng</label>
        <select class="input" id="sc-mood">${Object.entries(MOODS).map(([k,v])=>`<option value="${k}" ${rec.mood===k?'selected':''}>${v}</option>`).join('')}</select></div>
    </div>
    <div class="row" style="justify-content:flex-end;margin-top:6px">
      <button class="btn ghost" onclick="CTRC.closeModal()">Huỷ</button>
      <button class="btn primary" onclick="CTRC.saveScore()">Lưu & sinh nháp</button>
    </div>`);
  if(SCORE._suggest) renderSuggestBox(SCORE._suggest);
}
/* đồng bộ ô nhập vào rec trước khi re-render (chống mất chữ khi tap điểm) */
function syncScoreForm(){
  if($('#sc-obs')) SCORE.rec.observation = $('#sc-obs').value;
  if($('#sc-effort')) SCORE.rec.effort = $('#sc-effort').value;
  if($('#sc-mood')) SCORE.rec.mood = $('#sc-mood').value;
}
/* ── Trợ lý GV: gợi ý từ quan sát ── */
function gvSuggest(){
  syncScoreForm();
  SCORE._suggest = ENG.suggestFromObservation(SCORE.rec.observation, SCORE.rec.strengths);
  renderSuggestBox(SCORE._suggest);
  if(!SCORE.rec.observation.trim()) toast('Gõ vài chữ quan sát trước để có gợi ý','var(--primary-2)');
}
function renderSuggestBox(res){
  const box = $('#sc-suggest'); if(!box) return;
  if(!res){ box.innerHTML=''; return; }
  const sBank = SCORE.strengths;
  const newStr = (res.strengths||[]).filter(idx=>!(SCORE.rec.strengths||[]).includes(idx));
  const chips = newStr.map(idx=>{ const s=sBank.find(x=>x.idx===idx); return s?`<button class="chip" onclick="CTRC.applySuggestStrength(${idx})">+ ${esc(s.label)}</button>`:''; }).join('');
  const dimLabels = (res.dims||[]).map(k=>(ENG.DIMS.find(d=>d.key===k)||{}).label).filter(Boolean);
  const aiBtn = AI.usable()?`<button class="btn sm" type="button" onclick="CTRC.gvSuggestAI()">✨ Gợi ý sâu bằng AI</button>`:'';
  box.innerHTML = `<div style="background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px">
    ${res.thin?`<div class="voice-warn" style="margin:0 0 6px">⚠ ${esc(res.hints[0]||'Quan sát hơi sơ sài')}</div>`:''}
    ${chips?`<div style="font:600 10.5px/1 var(--font);color:var(--mute);margin-bottom:5px">Điểm mạnh gợi ý (bấm để thêm):</div><div class="chips">${chips}</div>`:''}
    ${dimLabels.length?`<div class="hint" style="margin-top:6px">Quan sát nhắc tới: <b>${esc(dimLabels.join(', '))}</b> — cân nhắc chấm các chiều này cao hơn.</div>`:''}
    ${(!chips&&!dimLabels.length&&!res.thin)?`<div class="hint" style="margin:0">Chưa nhận ra từ khoá rõ — ${aiBtn?'thử gợi ý AI bên dưới.':'thêm chi tiết hành vi cụ thể.'}</div>`:''}
    ${aiBtn?`<div style="margin-top:8px">${aiBtn}</div>`:''}
  </div>`;
}
function applySuggestStrength(idx){
  syncScoreForm();
  const arr = SCORE.rec.strengths||(SCORE.rec.strengths=[]);
  if(!arr.includes(idx)){ if(arr.length>=3){ toast('Tối đa 3 điểm mạnh','var(--primary-2)'); return; } arr.push(idx); }
  // cập nhật lại danh sách gợi ý (bỏ cái vừa thêm)
  renderScore();
}
async function gvSuggestAI(){
  if(!AI.usable()){ toast('Chưa cấu hình AI — bấm ⚙ AI trên thanh trên','var(--primary-2)'); return; }
  syncScoreForm();
  const obs = SCORE.rec.observation.trim();
  if(!obs){ toast('Cần có quan sát trước','var(--primary-2)'); return; }
  toast('✨ AI đang đọc quan sát…','var(--blue)');
  try{
    const bank = SCORE.strengths.map(s=>`${s.idx}. ${s.label}`).join('; ');
    const sys = 'Bạn hỗ trợ giáo viên mầm non chấm nhanh. Đọc câu quan sát, trả về JSON thuần.';
    const prompt = `Danh sách 10 điểm mạnh: ${bank}.\n5 chiều: focus(Tập trung), logic, reflex(Phản xạ), interaction(Tương tác), creativity(Sáng tạo).\nQuan sát của GV: "${obs}".\nTrả về DUY NHẤT JSON: {"strengths":[so idx phu hop nhat toi da 3],"scores":{"focus":1-5,"logic":1-5,"reflex":1-5,"interaction":1-5,"creativity":1-5},"feedback":"1 cau goi y ngan cho GV"}.`;
    const text = await AI.complete(sys, prompt);
    const m = text.match(/\{[\s\S]*\}/); const out = m?JSON.parse(m[0]):{};
    if(Array.isArray(out.strengths)){
      out.strengths.slice(0,3).forEach(idx=>{ const a=SCORE.rec.strengths||(SCORE.rec.strengths=[]); if(!a.includes(+idx)&&a.length<3) a.push(+idx); });
    }
    if(out.scores){ ENG.DIMS.forEach(d=>{ const v=+out.scores[d.key]; if(v>=1&&v<=5) SCORE.rec.scores_5d[d.key]=v; }); }
    SCORE._suggest = ENG.suggestFromObservation(SCORE.rec.observation, SCORE.rec.strengths);
    if(out.feedback) SCORE._aiFeedback = out.feedback;
    renderScore();
    toast('✨ AI đã gợi ý điểm mạnh + chấm thử' + (out.feedback?' — '+out.feedback.slice(0,50):''));
  }catch(e){ toast('Lỗi AI: '+e.message,'var(--primary-2)'); }
}
function setScore(k,n){ syncScoreForm(); SCORE.rec.scores_5d[k]=n; renderScore(); }
function toggleStrength(idx){
  syncScoreForm();
  const arr = SCORE.rec.strengths||(SCORE.rec.strengths=[]);
  const i = arr.indexOf(idx);
  if (i>=0) arr.splice(i,1);
  else { if (arr.length>=3){ toast('Tối đa 3 điểm mạnh','var(--primary-2)'); return; } arr.push(idx); }
  renderScore();
}
function setAttendance(a){ syncScoreForm(); SCORE.rec.attendance=a; renderScore(); }

async function saveScore(){
  const rec = SCORE.rec, stu = SCORE.stu;
  const existed = await DB.getRecord(GV.session.id, stu.id);
  // chặn ghi đè tin đã duyệt/đã gửi (SO_TAY mục 7)
  if (existed){
    const pm = await DB.getMessage(existed.id);
    if (pm && ['approved','sent'].includes(pm.status)){
      toast('Buổi này đã được CSKH duyệt — liên hệ CSKH để mở lại','var(--primary-2)');
      return;
    }
  }
  if (rec.attendance==='present'){
    rec.observation = $('#sc-obs').value.trim();
    rec.effort = $('#sc-effort').value.trim();
    rec.mood = $('#sc-mood').value;
  }
  const wasPresent = !!(existed && existed.attendance === 'present');
  const saved = await DB.saveRecord({
    session_id: GV.session.id, student_id: stu.id, attendance: rec.attendance,
    scores_5d: rec.scores_5d, strengths: rec.strengths, observation: rec.observation,
    effort: rec.effort, mood: rec.mood, created_by: STAFF.id,
  });
  await DB.audit(CENTER.id, STAFF, 'score', 'record', saved.id, {student:stu.name});

  // đếm buổi: chỉ đổi khi trạng thái present thay đổi (chống tăng trùng + có giảm)
  if (rec.attendance === 'present' && !wasPresent) await DB.softUpdateSessionCount(stu.id, +1).catch(()=>{});
  if (rec.attendance === 'absent'  &&  wasPresent) await DB.softUpdateSessionCount(stu.id, -1).catch(()=>{});

  if (rec.attendance==='absent'){
    toast('✓ Đã ghi nhận bé nghỉ'); closeModal(); loadRoster(); return;
  }

  // sinh nháp bằng engine (idempotent theo record)
  await generateForRecord(saved, stu);
  toast('✓ Đã lưu & sinh nháp → chuyển CSKH');
  closeModal(); loadRoster();
}

/* sinh nội dung cho 1 record + lưu message */
async function generateForRecord(rec, stu){
  const theme = await DB.getThemeFor(CENTER.id, GV.date);
  const profile = await DB.getProfile(stu.id);
  const strengths = await DB.listStrengths(CENTER.id);
  const recent = await DB.recentFeaturedStrengths(stu.id, 5);
  const out = ENG.generate({
    student: stu, record: rec, strengths,
    theme, profile: (profile && profile.status==='active') ? profile : null,
    recentFeatured: recent, date: GV.date,
  });
  await DB.saveMessage({
    record_id: rec.id, student_id: stu.id, status:'waiting_cs', source:'engine',
    diem_manh: out.diem_manh, co_gang: out.co_gang, goi_y: out.goi_y,
    ai_draft: {diem_manh:out.diem_manh,co_gang:out.co_gang,goi_y:out.goi_y},
    featured_strength: out.featured_strength,
  });
  await DB.audit(CENTER.id, STAFF, 'generate', 'message', rec.id, {student:stu.name, source:'engine'});
  // kích hoạt hồ sơ sau ≥3 buổi
  await maybeDraftProfile(stu);
}

async function maybeDraftProfile(stu){
  const prof = await DB.getProfile(stu.id);
  if (prof && prof.status==='active') return;
  // gom tất cả record present của bé
  const allSessions = await DB._allSessionsOfStudent(stu.id);
  if (allSessions.length < 3) {
    if (!prof) await DB.saveProfile({student_id:stu.id, status:'observing'});
    return;
  }
  const inferred = ENG.inferProfile(allSessions);
  await DB.saveProfile({
    student_id: stu.id, status:'draft', introversion: inferred.introversion,
    learning_style: inferred.learning_style, concerns: inferred.concerns,
    baseline_5d: inferred.baseline_5d, summary: inferred.summary, generated_at: new Date().toISOString(),
  });
  await DB.audit(CENTER.id, STAFF, 'profile_draft','profile',stu.id,{student:stu.name});
}

let MSG = null;
async function openMsg(id){
  const m = await DB.getMessageById(id);
  if (!m){ toast('Tin không còn tồn tại — tải lại danh sách','var(--primary-2)'); loadQueue(); return; }
  const stu = await DB.getStudent(m.student_id);
  // ngày buổi học thật (từ record→session)
  let date = todayStr();
  try { const rec = await DB._getRecordById(m.record_id); if(rec){ const ses = await DB._getSessionById(rec.session_id); if(ses) date = ses.date; } } catch(_){}
  MSG = { m, stu, date };
  EDITING_MSG = null;
  if (m.status==='waiting_cs'){
    try { const upd = await DB.updateMessageGuarded(m.id, m.version, {status:'cs_editing', lock_owner:STAFF.id, lock_at:new Date().toISOString()}); MSG.m = upd; EDITING_MSG = m.id; }
    catch(e){ toast(e.message,'var(--primary-2)'); }
  } else if (m.status==='cs_editing'){
    if (m.lock_owner === STAFF.id){ EDITING_MSG = m.id; }          // lấy lại lock của chính mình
    else if (m.lock_owner){
      const mins = m.lock_at ? Math.round((Date.now()-new Date(m.lock_at))/60000) : 99;
      if (mins<5) toast('⚠ Tin đang được thành viên khác mở sửa','var(--primary-2)');
      else { // lock cũ >5' → tiếp quản
        try { const upd = await DB.updateMessageGuarded(m.id, m.version, {lock_owner:STAFF.id, lock_at:new Date().toISOString()}); MSG.m = upd; EDITING_MSG = m.id; } catch(_){}
      }
    }
  }
  renderMsg();
}

  const {m, stu} = MSG;

  const approved = ['approved','sent'].includes(m.status);
  const aiBtn = `<button class="btn sm" onclick="CTRC.genAI()" title="${AI.usable()?'Model: '+AI.get().model:'Chưa cấu hình — vào Cấu hình → AI (Manager)'}">✨ Sinh bằng AI${AI.usable()?'':' ⚙'}</button>`;

        <div class="ln"><label>👍 Điểm mạnh hôm nay</label>
          <textarea class="input" id="m-dm" ${approved?'disabled':''} oninput="CTRC.voiceCheck()">${esc(m.diem_manh)}</textarea></div>
        <div class="ln"><label>🎯 Điểm cố gắng</label>
          <textarea class="input" id="m-cg" ${approved?'disabled':''} oninput="CTRC.voiceCheck()">${esc(m.co_gang)}</textarea></div>

          <textarea class="input" id="m-gy" ${approved?'disabled':''} oninput="CTRC.voiceCheck()">${esc(m.goi_y)}</textarea></div>

function MSG_DATE(){ return (MSG && MSG.date) || todayStr(); }

function readEdits(){

}
function voiceCheck(){
  const w=$('#voice-warn'); if(!w)return;
  const all = [$('#m-dm'),$('#m-cg'),$('#m-gy')].map(e=>e?e.value:'').join(' ');
  const r = ENG.checkVoice(all);

async function regen(){
  const rec = await DB._getRecordById(MSG.m.record_id);
  const stu = MSG.stu;
  const theme = await DB.getThemeFor(CENTER.id, todayStr());
  const profile = await DB.getProfile(stu.id);
  const strengths = await DB.listStrengths(CENTER.id);
  const recent = await DB.recentFeaturedStrengths(stu.id,5);
  const out = ENG.generate({student:stu,record:rec,strengths,theme,profile:(profile&&profile.status==='active')?profile:null,recentFeatured:recent,date:todayStr()});
  Object.assign(MSG.m,{diem_manh:out.diem_manh,co_gang:out.co_gang,goi_y:out.goi_y,ai_draft:out,source:'engine',featured_strength:out.featured_strength});
  renderMsg(); toast('↻ Đã sinh lại bằng engine');

function pasteAI(){
  modal(`<h3>Dán nháp từ Claude.ai / ChatGPT</h3>
    <p class="h-sub">Dán nguyên đoạn. Hệ thống tự tách 3 dòng nếu thấy "Điểm mạnh/Cố gắng/Gợi ý"; nếu không, dán vào ô đang chọn.</p>
    <textarea class="input" id="paste-src" style="min-height:160px"></textarea>
    <div class="row" style="justify-content:flex-end;margin-top:12px">
      <button class="btn ghost" onclick="CTRC.renderMsg()">Huỷ</button>
      <button class="btn primary" onclick="CTRC.applyPaste()">Áp dụng</button>
    </div>`);
}
function applyPaste(){
  const src = $('#paste-src').value;
  const grab = (re)=>{ const m=src.match(re); return m?m[1].trim():''; };
  const dm = grab(/(?:điểm mạnh|👍)[:\-–]?\s*([\s\S]*?)(?:\n.*?(?:cố gắng|🎯)|$)/i);
  const cg = grab(/(?:cố gắng|🎯)[:\-–]?\s*([\s\S]*?)(?:\n.*?(?:gợi ý|🏠)|$)/i);
  const gy = grab(/(?:gợi ý|🏠)[:\-–]?\s*([\s\S]*?)$/i);
  if (dm||cg||gy){
    Object.assign(MSG.m,{diem_manh:dm||MSG.m.diem_manh,co_gang:cg||MSG.m.co_gang,goi_y:gy||MSG.m.goi_y,ai_draft:{diem_manh:dm,co_gang:cg,goi_y:gy},source:'ai'});
    renderMsg(); toast('✓ Đã tách & áp nháp AI');
  } else {
    MSG.m.diem_manh = src.trim(); MSG.m.source='ai'; renderMsg();
    toast('Đã dán vào ô Điểm mạnh (không thấy nhãn 3 dòng)','var(--primary-2)');
  }
}
async function genAI(){
  if (!AI.usable()){ toast('Chưa cấu hình AI — vào Cấu hình → AI (Manager)','var(--primary-2)'); if(STAFF.role==='manager') go('config'); return; }
  toast('✨ Đang gọi AI ('+AI.get().model+')…','var(--blue)');
  try {
    const rec = await DB._getRecordById(MSG.m.record_id);
    const stu = MSG.stu;
    const theme = await DB.getThemeFor(CENTER.id, todayStr());
    const profile = await DB.getProfile(stu.id);
    const strengths = await DB.listStrengths(CENTER.id);
    const out = await AI.generate({student:stu,record:rec,theme,profile,strengths,center:CENTER});
    if(!out.diem_manh) throw new Error('Phản hồi AI rỗng');
    Object.assign(MSG.m,{diem_manh:out.diem_manh,co_gang:out.co_gang||MSG.m.co_gang,goi_y:out.goi_y||MSG.m.goi_y,ai_draft:out,source:'ai'});
    renderMsg(); toast('✨ AI đã viết xong ('+AI.get().model+')');
  } catch(e){ toast('Lỗi AI: '+e.message+' — giữ nháp engine','var(--primary-2)'); }
}
async function approve(){
  const edits = readEdits();
  if(!edits.diem_manh||!edits.co_gang||!edits.goi_y){ toast('Cần đủ 3 dòng trước khi duyệt','var(--primary-2)'); return; }
  try {
    const upd = await DB.updateMessageGuarded(MSG.m.id, MSG.m.version, Object.assign({
      status:'approved', approved_by:STAFF.id, approved_at:new Date().toISOString(), edited_by:STAFF.id, lock_owner:null, lock_at:null,
    }, edits));
    MSG.m = upd; EDITING_MSG = null;
    // token phụ huynh
    let tok = await DB.getExistingToken(MSG.m.id);
    if(!tok){ const t = await DB.createParentToken(MSG.m.id); tok={token:t}; }
    MSG.token = tok.token;
    await DB.audit(CENTER.id, STAFF, 'approve','message',MSG.m.id,{student:MSG.stu.name});
    $('#approve-zone').innerHTML = renderCopyZone();
    toast('✓ Đã duyệt — bấm Copy để gửi Zalo');
  } catch(e){ toast(e.message,'var(--primary-2)'); }
}
function renderCopyZone(){
  const link = parentBase()+'#t='+(MSG.token||'');
  const block = ENG.composeZalo(MSG.stu, MSG_DATE(), MSG.m, link);
  return `

    </div>`;
}
async function copyBlock(){
  const link = parentBase()+'#t='+(MSG.token||'');
  const block = ENG.composeZalo(MSG.stu, MSG_DATE(), MSG.m, link);
  try { await navigator.clipboard.writeText(block); toast('📋 Đã copy — dán vào Zalo phụ huynh'); }

}
async function copyLink(){
  try { await navigator.clipboard.writeText($('#p-link').value); toast('📋 Đã copy link'); } catch(_){}

async function markSent(){
  try {

async function insightsAI(){
  if(!AI.usable()){ toast('Chưa cấu hình AI — bấm ⚙ AI trên thanh trên','var(--primary-2)'); openAIConfig(); return; }
  if(!INS){ return; }
  const out = $('#insights-ai'); out.innerHTML = '⏳ AI đang phân tích…';
  try{
    const dims = ENG.DIMS.map(d=>`${d.label} ${INS.classAvg[d.key]||'—'}`).join(', ');
    const prog = INS.progressing.map(i=>`${i.name} (+${i.trend})`).join(', ')||'chưa có';
    const att = INS.attention.map(i=>`${i.name} (${i.reasons.join(', ')})`).join('; ')||'không có';
    const sys = 'Bạn là cố vấn giáo dục mầm non WonderKids. Phân tích số liệu lớp, đưa nhận định ấm áp, cụ thể, hướng hành động. KHÔNG phán xét bé, không dùng từ kém/yếu/tệ. Tiếng Việt tự nhiên.';
    const prompt = `Số liệu lớp tại ${CENTER.name}:\n- Tổng ${INS.totalStudents} bé, ${INS.totalRecords} lượt chấm.\n- Điểm TB từng chiều (1-5): ${dims}.\n- Chiều yếu nhất lớp: ${INS.weakest?INS.weakest.label:'—'}; mạnh nhất: ${INS.strongest?INS.strongest.label:'—'}.\n- Đang tiến bộ: ${prog}.\n- Cần chú ý: ${att}.\nViết ngắn gọn: (1) 2-3 câu nhận định tổng quan lớp; (2) 2-3 gợi ý hành động cụ thể cho giáo viên tuần tới (hoạt động 5-10 phút, không cần mua đồ).`;
    const text = await AI.complete(sys, prompt);
    out.style.color = 'var(--ink)';
    out.innerHTML = esc(text).replace(/\n/g,'<br>');
    await DB.audit(CENTER.id, STAFF, 'ai_insights','center',CENTER.id,{});
  }catch(e){ out.innerHTML = '⚠ Lỗi AI: '+esc(e.message); }
}

  const PST={observing:['Đang quan sát','b-wait'],draft:['Hồ sơ nháp','b-edit'],active:['Đã duyệt','b-ok']};
  view.innerHTML = `

      const p = profiles.find(x=>x.student_id===s.id) || {status:'observing'};

        <div class="row" style="justify-content:space-between">
          <b style="font:700 15px/1 var(--font)">${AV(s.gender)} ${esc(s.name)}</b>
          <span class="badge ${st[1]}">${st[0]}</span></div>

          <div class="hint">Tính cách: <b>${INT[p.introversion]||'?'}</b> · Kiểu học: <b>${STL[p.learning_style]||'?'}</b>${(p.concerns||[]).length?' · Theo dõi: '+esc((p.concerns||[]).join('; ')):''}</div>

async function approveProfile(studentId){
  const p = await DB.getProfile(studentId);
  if(!p) return;
  await DB.saveProfile({student_id:studentId, status:'active', approved_by:STAFF.id, approved_at:new Date().toISOString()});
  const stu = await DB.getStudent(studentId);
  await DB.audit(CENTER.id, STAFF, 'profile_approve','profile',studentId,{student:stu.name});
  toast('✓ Đã duyệt hồ sơ — AI sẽ dùng để cá nhân hoá'); viewProfiles();
}

/* ── Card cấu hình AI ── */
let AI_TARGET = '#ai-card-wrap';
function renderAICard(sel){
  if (sel) AI_TARGET = sel;
  const wrap = $(AI_TARGET); if(!wrap) return;
  const c = AICFG;
  const usable = c.mode==='edge' ? !!c.edgeFnUrl : !!c.apiKey;
  wrap.innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:center">
        <b style="font:800 13px/1 var(--font-d);color:var(--primary-2)">⚙ Cấu hình AI</b>
        <span class="badge ${usable?'b-ok':'b-wait'}">${usable?'Sẵn sàng · '+esc(c.model):'Chưa cấu hình'}</span>
      </div>
      <p class="hint" style="margin:6px 0 12px">Engine offline luôn hoạt động. Cấu hình dưới đây chỉ dùng cho nút <b>✨ Sinh bằng AI</b> ở màn CSKH.</p>

      <div class="row" style="gap:18px;margin-bottom:12px">
        <div class="field"><label>Nhà cung cấp</label>
          <select class="input" id="ai-provider">
            <option value="anthropic" ${c.provider==='anthropic'?'selected':''}>Anthropic — Claude</option>
          </select></div>
        <div class="field"><label>Chế độ kết nối</label>
          <div class="row" style="gap:14px;padding-top:6px">
            <label style="font:600 12px/1 var(--font);display:flex;gap:5px;align-items:center"><input type="radio" name="ai-mode" value="edge" ${c.mode==='edge'?'checked':''} onchange="CTRC.aiSetMode('edge')"> Edge Function <span class="hint">(an toàn)</span></label>
            <label style="font:600 12px/1 var(--font);display:flex;gap:5px;align-items:center"><input type="radio" name="ai-mode" value="direct" ${c.mode==='direct'?'checked':''} onchange="CTRC.aiSetMode('direct')"> Trực tiếp (key trình duyệt)</label>
          </div></div>
      </div>

      ${c.mode==='edge' ? `
        <div class="ln"><label>Edge Function URL</label>
          <input class="input" id="ai-edge" value="${esc(c.edgeFnUrl)}" placeholder="https://xxxx.supabase.co/functions/v1/generate" style="width:100%">
          <div class="hint">Key Claude nằm ở server (Supabase secret) — không lộ ra trình duyệt. Xem SETUP.md.</div></div>
      ` : `
        <div class="ln"><label>API key (Anthropic)</label>
          <input class="input" id="ai-key" type="password" value="${esc(c.apiKey)}" placeholder="sk-ant-..." style="width:100%">
          <div class="voice-warn">⚠ Chế độ trực tiếp lưu key trong localStorage của <b>máy này</b> và gọi thẳng API từ trình duyệt. Chỉ dùng trên máy tin cậy.</div></div>
        <div class="ln"><label>Base URL</label><input class="input" id="ai-base" value="${esc(c.baseUrl)}" style="width:100%"></div>
      `}

      <div class="row" style="align-items:flex-end;gap:12px">
        <div class="field" style="flex:1;min-width:220px"><label>Model (gõ để lọc, hoặc chọn)</label>
          <input class="input" id="ai-model" list="ai-models-dl" value="${esc(c.model)}" placeholder="claude-sonnet-4-5" style="width:100%">
          <datalist id="ai-models-dl">${(c.models||[]).map(m=>`<option value="${esc(m.id)}">${esc(m.name||m.id)}</option>`).join('')}</datalist>
        </div>
        <button class="btn sm" onclick="CTRC.aiLoadModels()" title="Gọi API lấy danh sách model thật để lọc">🔄 Tải model từ API</button>
        <div class="field" style="width:110px"><label>Max tokens</label><input class="input" id="ai-maxtok" type="number" value="${c.maxTokens}"></div>
      </div>
      <div class="hint">${(c.models||[]).length} model trong danh sách lọc${c.modelsSource?(' · nguồn: '+esc(c.modelsSource)):''}.</div>

      <div class="row" style="justify-content:flex-end;margin-top:14px">
        <button class="btn sm" onclick="CTRC.aiTest()">🧪 Kiểm tra kết nối</button>
        <button class="btn primary sm" onclick="CTRC.aiSave()">💾 Lưu cấu hình AI</button>
      </div>
    </div>`;
}
function aiReadForm(){
  const root = $(AI_TARGET) || document;     // đọc trong đúng container (tab hoặc modal)
  const el=id=>root.querySelector('#'+id);
  const val=id=>{const e=el(id);return e?e.value:undefined;};
  const m=(root.querySelector('input[name="ai-mode"]:checked')||{}).value; if(m) AICFG.mode=m;
  if(el('ai-provider')) AICFG.provider=val('ai-provider');
  if(el('ai-edge')) AICFG.edgeFnUrl=val('ai-edge').trim();
  if(el('ai-key')) AICFG.apiKey=val('ai-key').trim();
  if(el('ai-base')) AICFG.baseUrl=val('ai-base').trim();
  if(el('ai-model')) AICFG.model=val('ai-model').trim();
  if(el('ai-maxtok')) AICFG.maxTokens=+val('ai-maxtok')||600;
}
function aiSetMode(mode){ aiReadForm(); AICFG.mode=mode; renderAICard(); }
async function aiLoadModels(){
  aiReadForm();
  toast('Đang tải model…','var(--blue)');
  try{
    const models=await AI.listModels(AICFG);
    if(!models.length) throw new Error('API trả về 0 model');
    AICFG.models=models; AICFG.modelsSource='API';
    renderAICard(); toast('✓ Đã tải '+models.length+' model — gõ vào ô Model để lọc');
  }catch(e){ toast('Lỗi tải model: '+e.message,'var(--primary-2)'); }
}
async function aiTest(){
  aiReadForm();
  if(!(AICFG.mode==='edge'?AICFG.edgeFnUrl:AICFG.apiKey)){ toast('Điền URL/key trước khi test','var(--primary-2)'); return; }
  toast('🧪 Đang gọi thử ('+AICFG.model+')…','var(--blue)');
  try{
    const out=await AI.generate({student:{name:'Bé Minh'},record:{scores_5d:{focus:4,logic:3,reflex:4,interaction:3,creativity:5},strengths:[],observation:'tự ghép đúng 5 mảnh, kiên nhẫn thử lại khi sai',effort:'',mood:'happy'},theme:{title:'Ghép hình'},profile:null,strengths:[],center:CENTER}, AICFG);
    if(!out.diem_manh) throw new Error('Phản hồi rỗng');
    modal(`<h3>🧪 Kết quả thử — ${esc(AICFG.model)}</h3>
      <div class="draft-box"><div class="ln"><b>👍 Điểm mạnh:</b> ${esc(out.diem_manh)}</div>
      <div class="ln"><b>🎯 Cố gắng:</b> ${esc(out.co_gang||'(trống)')}</div>
      <div><b>🏠 Gợi ý:</b> ${esc(out.goi_y||'(trống)')}</div></div>
      <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn primary" onclick="CTRC.closeModal()">Đóng</button></div>`);
    toast('✓ Kết nối AI OK');
  }catch(e){ toast('Lỗi: '+e.message,'var(--primary-2)'); }
}
function aiSave(){
  aiReadForm();
  AI.save(AICFG);
  DB.audit(CENTER.id, STAFF, 'ai_config','center',CENTER.id,{mode:AICFG.mode,model:AICFG.model});
  toast('💾 Đã lưu cấu hình AI'); renderAICard();
}
