let SM = { classId:'', search:'' };
async function viewStudents(){
  const classes = await DB.listClasses(CENTER.id);
  const counts = await DB.classCounts(CENTER.id);
  if(!SM.classId && classes[0]) SM.classId = classes[0].id;
  const total = Object.values(counts).reduce((a,b)=>a+b,0);
  view.innerHTML = `
    <h2 class="h-title">Lớp & Học viên</h2>
    <p class="h-sub">${classes.length} lớp · ${total} bé đang học. Thêm lớp, thêm bé lẻ, hoặc nhập danh sách hàng loạt.</p>
    <div class="card" style="margin-bottom:12px">
      <div class="row" style="align-items:flex-end">
        <div class="field" style="min-width:210px"><label>Lớp</label>
          <select class="input" id="sm-class">${classes.map(c=>`<option value="${c.id}" ${SM.classId===c.id?'selected':''}>${esc(c.name)} · ${counts[c.id]||0} bé</option>`).join('')||'<option value="">(chưa có lớp)</option>'}</select></div>
        <button class="btn sm" onclick="CTRC.addClass()">+ Lớp</button>
        ${classes.length?`<button class="btn sm" onclick="CTRC.renameClass()">✎ Đổi tên</button>`:''}
        <div class="field" style="flex:1;min-width:160px"><label>Tìm bé</label><input class="input" id="sm-search" placeholder="🔍 Tên bé…" value="${esc(SM.search)}"></div>
      </div>
      ${classes.length?`<div class="row" style="margin-top:11px">
        <button class="btn primary sm" onclick="CTRC.addStudentPrompt()">+ Thêm bé</button>
        <button class="btn sm" onclick="CTRC.bulkStudents()">📋 Nhập danh sách (dán nhiều tên)</button>
      </div>`:'<p class="hint" style="margin-top:10px">Chưa có lớp nào — bấm <b>+ Lớp</b> để bắt đầu.</p>'}
    </div>
    <div id="sm-list"></div>`;
  const cs=$('#sm-class'); if(cs) cs.onchange = e=>{ SM.classId=e.target.value; SM.search=''; viewStudents(); };
  const ss=$('#sm-search'); if(ss) ss.oninput = e=>{ SM.search=e.target.value; renderStudents(); };
  renderStudents();
}
async function renderStudents(){
  const box=$('#sm-list'); if(!box) return;
  if(!SM.classId){ box.innerHTML=''; return; }
  const all = await DB.listStudents(CENTER.id, SM.classId);
  const q=(SM.search||'').toLowerCase().trim();
  const list = all.filter(s=>!q||s.name.toLowerCase().includes(q));
  box.innerHTML = `<div class="card"><table class="tb"><thead><tr><th>Tên bé</th><th>Giới tính</th><th>Số buổi</th><th style="text-align:right">Thao tác</th></tr></thead><tbody>
    ${list.map(s=>`<tr>
      <td><b>${AV(s.gender)} ${esc(s.name)}</b></td><td>${esc(s.gender)}</td><td>${s.session_count||0}</td>
      <td style="text-align:right"><button class="btn sm" onclick="CTRC.editStudent('${s.id}')">Sửa</button> <button class="btn sm" onclick="CTRC.delStudent('${s.id}')">🗑</button></td>
    </tr>`).join('')||`<tr><td colspan=4 style="color:var(--mute)">${all.length?'Không có bé khớp tìm kiếm.':'Lớp chưa có bé — bấm “+ Thêm bé” hoặc “Nhập danh sách”.'}</td></tr>`}
    </tbody></table></div>`;
}
async function addClass(){
  const name=prompt('Tên lớp mới (vd "Lớp Mầm C"):',''); if(name==null) return;
  const t=name.trim(); if(!t){ toast('Tên lớp trống','var(--primary-2)'); return; }
  const age=prompt('Độ tuổi (tuỳ chọn, vd "4 tuổi"):','')||'';
  const c=await DB.addClass(CENTER.id, t, age.trim());
  SM.classId=c.id; await DB.audit(CENTER.id,STAFF,'add_class','class',c.id,{name:t});
  toast('✓ Đã thêm lớp '+t); viewStudents();
}
async function renameClass(){
  if(!SM.classId) return;
  const classes=await DB.listClasses(CENTER.id); const c=classes.find(x=>x.id===SM.classId); if(!c) return;
  const name=prompt('Đổi tên lớp:',c.name); if(name==null) return; const t=name.trim(); if(!t) return;
  await DB.renameClass(c.id,t); toast('✓ Đã đổi tên lớp'); viewStudents();
}
function studentForm(s){
  const editing=!!s;
  modal(`<h3>${editing?'Sửa thông tin bé':'Thêm bé mới'}</h3>
    <div class="ln"><label>Tên bé</label><input class="input" id="sf-name" value="${esc(s?s.name:'')}" style="width:100%" placeholder="VD: Nguyễn Hải An"></div>
    <div class="field" style="margin-bottom:12px"><label>Giới tính</label><select class="input" id="sf-gender"><option ${(!s||s.gender==='Nam')?'selected':''}>Nam</option><option ${(s&&s.gender==='Nữ')?'selected':''}>Nữ</option></select></div>
    <div class="ln"><label>SĐT phụ huynh (tuỳ chọn)</label><input class="input" id="sf-phone" value="${esc(s?(s.parent_phone||''):'')}" style="width:100%" placeholder="09xx..."></div>
    <div class="row" style="justify-content:flex-end;margin-top:6px"><button class="btn ghost" onclick="CTRC.closeModal()">Huỷ</button><button class="btn primary" onclick="CTRC.saveStudent('${s?s.id:''}')">Lưu</button></div>`);
}
function addStudentPrompt(){ if(!SM.classId){toast('Tạo lớp trước','var(--primary-2)');return;} studentForm(null); }
async function editStudent(id){ const s=await DB.getStudent(id); if(s) studentForm(s); }
async function saveStudent(id){
  const name=$('#sf-name').value.trim(); if(!name){ toast('Tên trống','var(--primary-2)'); return; }
  const gender=$('#sf-gender').value; const phone=$('#sf-phone').value.trim();
  if(id){ await DB.updateStudent(id,{name,gender,parent_phone:phone}); }
  else { await DB.addStudent({center_id:CENTER.id, class_id:SM.classId, name, gender, parent_phone:phone}); await DB.audit(CENTER.id,STAFF,'add_student','student',null,{name}); }
  closeModal(); toast('✓ Đã lưu'); viewStudents();
}
async function delStudent(id){
  const s=await DB.getStudent(id);
  if(!confirm('Xoá bé "'+(s?s.name:'')+'" khỏi danh sách?\n(Ẩn khỏi danh sách, dữ liệu/báo cáo cũ vẫn được giữ.)')) return;
  await DB.softDeleteStudent(id); await DB.audit(CENTER.id,STAFF,'del_student','student',id,{name:s?s.name:''});
  toast('✓ Đã xoá khỏi danh sách'); viewStudents();
}
function bulkStudents(){
  if(!SM.classId){toast('Tạo lớp trước','var(--primary-2)');return;}
  modal(`<h3>Nhập danh sách bé</h3>
    <p class="h-sub">Dán danh sách, MỖI DÒNG 1 bé. Thêm giới tính sau dấu phẩy nếu muốn: <code>Tên, Nữ</code> (mặc định Nam).</p>
    <textarea class="input" id="bulk-src" style="min-height:170px;width:100%" placeholder="Nguyễn Hải An&#10;Trần Bảo Ngọc, Nữ&#10;Lê Minh Khôi"></textarea>
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn ghost" onclick="CTRC.closeModal()">Huỷ</button><button class="btn primary" onclick="CTRC.applyBulk()">Thêm tất cả</button></div>`);
}
async function applyBulk(){
  const lines=$('#bulk-src').value.split('\n').map(l=>l.trim()).filter(Boolean);
  if(!lines.length){ toast('Chưa có tên nào','var(--primary-2)'); return; }
  let n=0;
  for(const line of lines){
    const parts=line.split(','); const name=(parts[0]||'').trim(); if(!name) continue;
    const gender=/n[ữu]|gái|gai/i.test((parts[1]||'').trim())?'Nữ':'Nam';
    await DB.addStudent({center_id:CENTER.id, class_id:SM.classId, name, gender}); n++;
  }
  await DB.audit(CENTER.id,STAFF,'bulk_students','class',SM.classId,{count:n});
  closeModal(); toast('✓ Đã thêm '+n+' bé'); viewStudents();
}

async function approveProfile(studentId){

async function _saveReportConfigPresets(cfg, action){ await DB.updateCenter(CENTER.id, { report_config:cfg }); CENTER.report_config=cfg; await DB.audit(CENTER.id, STAFF, action, 'center', CENTER.id, {}); viewConfig(); }
async function rcSavePreset(kind){
  const tx=$('#rc-'+kind); const val=(tx&&tx.value||'').trim(); if(!val){ toast('Nhập nội dung trước khi lưu gợi ý','var(--primary-2)'); return; }

}
async function rcDeletePreset(kind){
  const sel=$('#rc-'+kind+'-preset'); const val=(sel&&sel.value||'').trim(); if(!val){ toast('Chọn gợi ý cần xoá trong dropdown','var(--primary-2)'); return; }
  if(reportIsDefaultPreset(kind,val)){ toast('Gợi ý mặc định không xoá; chỉ xoá được gợi ý tự thêm','var(--primary-2)'); return; }
  if(!confirm('Xoá gợi ý này khỏi dropdown?')) return;
  const cfg=_readReportConfigEditor(); cfg.presets=Object.assign({tone:[],detail:[],audience:[]}, cfg.presets||{});

/* ── TÙY CHỈNH 5 TIÊU CHÍ (lưu centers.criteria — đồng bộ mọi máy) ── */
function _readCritEditor(){
  return ENG.CRITERIA.map((c,i)=>{
    const g=id=>{ const el=$('#'+id+'-'+i); return el?el.value:''; };
    const lines=v=>v.split('\n').map(s=>s.trim()).filter(Boolean);
    return { key:c.key, emoji:g('crit-emoji').trim()||c.emoji, label:g('crit-label').trim(),
      desc:g('crit-desc').trim(), pos:lines(g('crit-pos')), neg:lines(g('crit-neg')), tip:g('crit-tip').trim() };
  });
}
async function critSave(){
  const list=_readCritEditor();
  for(const c of list){
    if(!c.label){ toast('Có tiêu chí đang thiếu TÊN','var(--primary-2)'); return; }
    if(!c.pos.length || !c.neg.length){ toast(`"${c.label}": cần ít nhất 1 câu điểm mạnh + 1 câu cần cải thiện`,'var(--primary-2)'); return; }
    const v=ENG.checkVoice(c.pos.concat(c.neg,[c.desc,c.tip]).join(' '));
    if(!v.ok){ toast(`"${c.label}" chứa từ nên tránh với phụ huynh: ${v.banned.join(', ')}`,'var(--primary-2)'); return; }
  }
  try{
    await DB.updateCenter(CENTER.id, { criteria:list });
    CENTER.criteria=list; ENG.setCriteria(list);
    await DB.audit(CENTER.id, STAFF, 'criteria_update', 'center', CENTER.id, {});
    toast('✓ Đã lưu 5 tiêu chí — áp dụng cho mọi máy');
    viewConfig();
  }catch(e){
    const msg=String(e.message||e);
    toast(/criteria/.test(msg)?'Thiếu cột criteria trên Supabase — chạy ctrc/schema-patch-v3.sql (3 dòng) rồi lưu lại':'Lỗi lưu: '+msg,'var(--primary-2)');
  }
}
async function critReset(){
  if(!confirm('Trả 5 tiêu chí về bản gốc WonderKids? (Bản tùy chỉnh hiện tại sẽ mất)')) return;
  try{
    await DB.updateCenter(CENTER.id, { criteria:null });
    CENTER.criteria=null; ENG.setCriteria(ENG.defaultCriteria());
    await DB.audit(CENTER.id, STAFF, 'criteria_reset', 'center', CENTER.id, {});
    toast('↺ Đã trả về bản gốc'); viewConfig();
  }catch(e){ toast('Lỗi: '+(e.message||e),'var(--primary-2)'); }
}

function aiReadForm(){
  const root = $(AI_TARGET) || document;     // đọc trong đúng container (tab hoặc modal)
  const el=id=>root.querySelector('#'+id);
  const val=id=>{const e=el(id);return e?e.value:undefined;};
  const m=(root.querySelector('input[name="ai-mode"]:checked')||{}).value; if(m) AICFG.mode=m;
  if(el('ai-provider')) AICFG.provider=val('ai-provider');
  if(el('ai-edge')) AICFG.edgeFnUrl=val('ai-edge').trim();
  if(el('ai-key')) AICFG.apiKey=val('ai-key').trim();
  if(el('ai-base')) AICFG.baseUrl=val('ai-base').trim();
  if(el('ai-model')) AICFG.model=val('ai-model').trim();
  if(el('ai-maxtok')) AICFG.maxTokens=+val('ai-maxtok')||600;
  if(el('ai-thinking')) AICFG.thinking=val('ai-thinking');
}
/* dán key xong → tự nạp danh sách model */
async function aiKeyBlur(){
  aiReadForm();
  if(AICFG.mode==='direct' && AICFG.apiKey && AICFG.apiKey.length>20 && AICFG.modelsSource!=='API'){
    aiLoadModels();
  }
}
function aiSetMode(mode){ aiReadForm(); AICFG.mode=mode; renderAICard(); }
/* đổi nhà cung cấp → nạp base URL + model mặc định + danh sách gợi ý đúng hãng (không đè key đang gõ) */
function aiSetProvider(p){
  aiReadForm();
  AICFG.provider=p;
  if(p==='gemini'){
    if(!AICFG.model || /claude/i.test(AICFG.model)) AICFG.model='gemini-3.5-flash';
    if(!AICFG.baseUrl || /anthropic/i.test(AICFG.baseUrl)) AICFG.baseUrl=AI.GEMINI_BASE;
    AICFG.models=AI.GEMINI_MODELS.slice();
  }else{
    if(!AICFG.model || /gemini/i.test(AICFG.model)) AICFG.model='claude-sonnet-4-5';
    if(!AICFG.baseUrl || /googleapis/i.test(AICFG.baseUrl)) AICFG.baseUrl=AI.ANTHROPIC_BASE;
    AICFG.models=AI.DEFAULT_MODELS.slice();
  }
  AICFG.modelsSource=''; renderAICard();
}
async function aiLoadModels(){
  aiReadForm();
  toast('Đang tải model…','var(--blue)');
  try{
    const models=await AI.listModels(AICFG);
    if(!models.length) throw new Error('API trả về 0 model');
    AICFG.models=models; AICFG.modelsSource='API';
    renderAICard(); toast('✓ Đã tải '+models.length+' model — gõ vào ô Model để lọc');
  }catch(e){ toast('Lỗi tải model: '+e.message,'var(--primary-2)'); }
}
async function aiTest(){
  aiReadForm();
  if(!(AICFG.mode==='edge'?AICFG.edgeFnUrl:AICFG.apiKey)){ toast('Điền URL/key trước khi test','var(--primary-2)'); return; }
  toast('🧪 Đang gọi thử ('+AICFG.model+')…','var(--blue)');
  try{
    const out=await AI.generate({student:{name:'Bé Minh'},record:{strength:{crit:'tu_lap',sentence:'Hoàn thành nhiệm vụ độc lập.',detail:'tự ghép đúng 5 mảnh, kiên nhẫn thử lại khi sai'},improve:{crit:'hop_tac',sentence:'Còn ít tương tác với các bạn trong nhóm.',detail:'thường chơi một mình, ngại bắt chuyện'},mood:'happy'},theme:{title:'Ghép hình'},profile:null,center:CENTER}, AICFG);
    if(!out.diem_manh) throw new Error('Phản hồi rỗng');
    modal(`<h3>🧪 Kết quả thử — ${esc(AICFG.model)}</h3>
      <div class="draft-box"><div class="ln"><b>👍 Điểm mạnh:</b> ${esc(out.diem_manh)}</div>
      <div><b>🎯 Cố gắng:</b> ${esc(out.co_gang||'(trống)')}</div></div>
      <div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn primary" onclick="CTRC.closeModal()">Đóng</button></div>`);
    toast('✓ Kết nối AI OK');
  }catch(e){ toast('Lỗi: '+e.message,'var(--primary-2)'); }
}
function aiSave(){
  aiReadForm();
  AI.save(AICFG);
  DB.audit(CENTER.id, STAFF, 'ai_config','center',CENTER.id,{mode:AICFG.mode,model:AICFG.model});

}

/* ── Quản lý nhân sự (đổi tên/thêm/xoá) ── */
function staffForm(s){
  const editing=!!s;
  modal(`<h3>${editing?'Đổi thông tin nhân sự':'Thêm nhân sự'}</h3>
    <div class="ln"><label>Tên hiển thị</label><input class="input" id="st-name" value="${esc(s?s.name:'')}" style="width:100%" placeholder="VD: Cô Hương"></div>
    <div class="field" style="margin-bottom:12px"><label>Vai trò</label><select class="input" id="st-role">
      ${Object.entries(ROLE_LABEL).map(([k,v])=>`<option value="${k}" ${s&&s.role===k?'selected':''}>${v}</option>`).join('')}</select></div>
    <div class="row" style="justify-content:flex-end"><button class="btn ghost" onclick="CTRC.closeModal()">Huỷ</button><button class="btn primary" onclick="CTRC.saveStaff('${s?s.id:''}')">Lưu</button></div>`);
}
function addStaff(){ staffForm(null); }
async function editStaff(id){ const s=(await DB.listStaff(CENTER.id)).find(x=>x.id===id); if(s) staffForm(s); }
async function saveStaff(id){
  const name=$('#st-name').value.trim(); if(!name){ toast('Tên không được trống','var(--primary-2)'); return; }
  const role=$('#st-role').value;
  if(id){
    await DB.updateStaff(id,{name,role});
    if(STAFF && STAFF.id===id){ STAFF.name=name; STAFF.role=role; sessionStorage.setItem('ctrc:staff',JSON.stringify(STAFF));
      $('#uc-name').textContent=name; const r=$('#uc-role'); r.textContent=role; r.className='role '+role; buildNav(); }
  } else { await DB.addStaff(CENTER.id, name, role); }
  await DB.audit(CENTER.id, STAFF, id?'edit_staff':'add_staff','staff',id||null,{name,role});
  closeModal(); toast('✓ Đã lưu'); viewConfig();
}
async function delStaff(id){
  if(STAFF && STAFF.id===id){ toast('Không thể xoá tài khoản đang đăng nhập','var(--primary-2)'); return; }
  const s=(await DB.listStaff(CENTER.id)).find(x=>x.id===id);
  if(!confirm('Xoá nhân sự "'+(s?s.name:'')+'"?')) return;
  await DB.deleteStaff(id); await DB.audit(CENTER.id, STAFF, 'del_staff','staff',id,{name:s?s.name:''});
  toast('✓ Đã xoá'); viewConfig();
}

/* ═══ LƯỚI AN TOÀN: không để lỗi nào làm app "đứng hình" mà không báo ═══
   Trước đây một lỗi mạng lúc khởi động làm màn hình trắng trơn, người dùng
   không biết chuyện gì. Nay mọi lỗi lọt lưới đều hiện toast + ghi console. */
window.addEventListener('error', function(ev){
  console.error('[global error]', ev.error||ev.message);
  try{ toast('Có lỗi kỹ thuật: '+((ev.error&&ev.error.message)||ev.message||'không rõ')+' — thử tải lại trang','var(--primary-2)'); }catch(_){}
});
window.addEventListener('unhandledrejection', function(ev){
  const r=ev.reason; console.error('[unhandled promise]', r);
  const m=(r&&r.message)||String(r||'không rõ');
  // lỗi mạng khi đang dùng app → nhắc rõ ràng thay vì im lặng
  const netlike=/Failed to fetch|NetworkError|ERR_|fetch/i.test(m);
  try{ toast(netlike?('Mất kết nối máy chủ — thao tác vừa rồi CHƯA được lưu. Kiểm tra mạng rồi thử lại.'):('Có lỗi: '+m),'var(--primary-2)'); }catch(_){}
});
/* mất/khôi phục mạng khi đang làm việc */
window.addEventListener('offline', function(){ try{ toast('📴 Mất mạng — tạm dừng nhập liệu, dữ liệu chưa lưu sẽ không lên hệ thống','var(--primary-2)'); }catch(_){} });
window.addEventListener('online',  function(){ try{ toast('🟢 Có mạng trở lại — tải lại trang để đồng bộ'); }catch(_){} });

boot();
