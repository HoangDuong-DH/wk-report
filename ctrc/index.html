<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CTRC — Báo cáo per-buổi · WonderKids</title>
<meta name="description" content="Hệ thống báo cáo học tập per-buổi: GV chấm → AI viết → CSKH duyệt → phụ huynh xem.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect x='8' y='8' width='48' height='48' rx='14' fill='%23bd4f24'/><text x='32' y='41' font-family='Arial' font-size='20' font-weight='900' fill='%23fff' text-anchor='middle'>CT</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --font:'Be Vietnam Pro',system-ui,sans-serif;
  --font-d:'Be Vietnam Pro',system-ui,sans-serif;
  --primary:#df6b2d; --primary-2:#bd4f24; --yellow:#c99a2c;
  --green:#3f9855; --blue:#3f7fa6; --ink:#302c27; --ink-soft:#615b52; --mute:#8b8074;
  --cream:#f6f3ed; --cream-2:#eee7dc; --card:#fffdf8; --line:#ded6ca; --line-soft:#eee7dc;
  --pill:#f2ebe1; --shadow:0 1px 2px rgba(42,32,22,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;font-family:var(--font);color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
.hidden{display:none !important}
.skip-link{position:fixed;left:12px;top:12px;z-index:10000;transform:translateY(-160%);background:#2f2b26;color:#fff;border-radius:8px;padding:9px 12px;font:800 12px/1 var(--font);text-decoration:none;box-shadow:0 8px 24px rgba(42,32,22,.18)}
.skip-link:focus{transform:none}

/* ── Top bar ── */
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;
  padding:10px 18px;background:rgba(255,253,249,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.home-link{display:inline-flex;align-items:center;gap:5px;text-decoration:none;color:var(--ink-soft);
  font:700 12px/1 var(--font);padding:7px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;white-space:nowrap}
.home-link:hover{border-color:var(--primary);color:var(--primary-2)}
.brand{display:flex;align-items:center;gap:10px;font:800 17px/1 var(--font-d);color:var(--primary-2);text-decoration:none}
.demo-banner a{color:#8a5a00;font-weight:800;text-decoration:underline;cursor:pointer}
.brand .logo{width:34px;height:34px;border-radius:50%;background:var(--primary);
  display:flex;align-items:center;justify-content:center;color:#fff;font:800 13px/1 var(--font-d)}
.brand .sub{font:600 10px/1 var(--font);color:var(--mute);letter-spacing:.05em}
.nav{display:flex;gap:4px;margin-left:8px;flex-wrap:wrap}
.nav button{padding:7px 13px;border:1px solid transparent;background:transparent;border-radius:9px;
  font:700 12.5px/1 var(--font);color:var(--ink-soft)}
.nav button:hover{background:var(--pill);color:var(--primary-2)}
.nav button.active{background:var(--ink);color:#fff}
.spacer{flex:1}
.topbar-gear{border:1px solid var(--line);background:#fff;color:var(--ink-soft);font:700 12px/1 var(--font);
  padding:7px 11px;border-radius:9px;margin-right:8px;white-space:nowrap}
.topbar-gear:hover{border-color:var(--primary);color:var(--primary-2)}
.userchip{display:flex;align-items:center;gap:2px;background:var(--cream);border:1px solid var(--line);
  padding:3px 4px 3px 4px;border-radius:99px;font:700 12px/1 var(--font)}
.userchip .uc-switch{display:flex;align-items:center;gap:8px;border:none;background:transparent;
  padding:4px 8px;border-radius:99px;font:inherit;color:var(--ink)}
.userchip .uc-switch:hover{background:#fff}
.userchip .uc-switch .caret{color:var(--mute);font-size:10px}
.userchip .role{font:700 9.5px/1 var(--font);text-transform:uppercase;letter-spacing:.06em;color:#fff;
  padding:4px 8px;border-radius:99px;background:var(--mute)}
.userchip .role.gv{background:var(--green)} .userchip .role.cskh{background:var(--blue)} .userchip .role.manager{background:var(--primary)}
.userchip .uc-logout{border:none;background:transparent;color:var(--mute);font-size:15px;padding:4px 8px;border-radius:99px}
.userchip .uc-logout:hover{background:#fff;color:var(--primary-2)}

/* dropdown đổi tài khoản */
.account-menu{position:fixed;inset:0;z-index:300}
.account-menu.hidden{display:none}
.account-menu .am-bg{position:absolute;inset:0}
.account-menu .am-panel{position:absolute;background:var(--card);border:1px solid var(--line);
  border-radius:14px;box-shadow:0 14px 40px rgba(60,30,10,.22);padding:7px;min-width:248px}
.am-head{font:700 9.5px/1 var(--font);text-transform:uppercase;letter-spacing:.06em;color:var(--mute);padding:8px 10px 6px}
.am-item{display:flex;align-items:center;gap:10px;width:100%;border:none;background:transparent;
  padding:9px 10px;border-radius:10px;text-align:left;font:inherit}
.am-item:hover{background:var(--pill)}
.am-item.cur{background:var(--cream-2)}
.am-item .am-nm{flex:1;font:700 13px/1.2 var(--font);color:var(--ink)}
.am-item .am-nm small{display:block;font:500 10.5px/1.3 var(--font);color:var(--mute);margin-top:2px}
.demo-banner{background:#fff4d8;color:#8a6d1a;text-align:center;
  font:600 11.5px/1.4 var(--font);padding:6px 12px;border-bottom:1px solid #f0d98a}

/* ── Layout ── */
.wrap{max-width:1080px;margin:0 auto;padding:18px}
.h-title{font:800 19px/1.2 var(--font-d);color:var(--primary-2);margin:0 0 3px}
.h-sub{font:500 12.5px/1.5 var(--font);color:var(--ink-soft);margin:0 0 16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font:700 10px/1 var(--font);text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
.field input,.field select,.input{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font:500 13px/1.2 var(--font);color:var(--ink)}
.input:focus,.field input:focus,.field select:focus{outline:2px solid var(--primary);border-color:var(--primary)}

.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px 18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.btn{padding:10px 16px;border-radius:11px;border:1px solid var(--line);background:#fff;font:700 13px/1 var(--font);color:var(--ink-soft)}
.btn:hover{border-color:var(--primary);color:var(--primary-2)}
.btn.primary{background:var(--primary-2);color:#fff;border:none}
.btn.primary:hover{box-shadow:0 6px 16px rgba(233,78,27,.3);transform:translateY(-1px)}
.btn.green{background:var(--green);color:#fff;border:none}
.btn.warn{background:#fff3e8;color:var(--primary-2);border:1.5px solid var(--primary-2)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:7px 11px;font-size:12px}

/* ── Roster ── */
.roster{display:grid;gap:8px;margin-top:14px}
.stu-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:13px;cursor:pointer;transition:.15s}
.stu-row:hover{border-color:var(--primary);box-shadow:var(--shadow)}
.stu-row .av{width:40px;height:40px;border-radius:50%;background:var(--cream-2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.stu-row .nm{font:700 14px/1.2 var(--font);flex:1}
.stu-row .nm small{display:block;font:500 11px/1.3 var(--font);color:var(--mute);margin-top:2px}
.badge{font:700 10px/1 var(--font);padding:5px 10px;border-radius:99px;white-space:nowrap}
.stu-row.overdue{border-color:#f0a98f;background:#fff6f2}
.q-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0}
.sla{font:600 10px/1 var(--font);color:var(--mute);white-space:nowrap}
.sla.over{color:#c5421c;font-weight:800}
.b-wait{background:#fff1dd;color:#c0691a} .b-cs{background:#e3f0fb;color:#2f6ea0}
.b-ok{background:#eaf7e0;color:#46901f} .b-sent{background:#e7f5ea;color:#2f8a4e}
.b-absent{background:#f0e9e2;color:#8a7763} .b-err{background:#fde6dd;color:#c5421c} .b-edit{background:#fbeccf;color:#9a7415}

/* ── Score form ── */
.dim{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line-soft)}
.dim .dl{font:700 13px/1 var(--font);flex:1}
.scale{display:flex;gap:5px}
.scale button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:#fff;font:700 13px/1 var(--font);color:var(--ink-soft)}
.scale button.on{background:var(--primary-2);color:#fff;border:none}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:6px}
.chip{padding:7px 12px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font:600 12px/1.2 var(--font);color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px;cursor:pointer;transition:transform .1s ease, background .12s, border-color .12s}
.chip:active{transform:scale(.94)}
.chip.on{animation:chip-pop .18s ease}
@keyframes chip-pop{0%{transform:scale(.9)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
.chip:hover{border-color:var(--green)}
.chip.imp:hover{border-color:var(--primary-2)}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}
.chip.on.imp{background:var(--primary-2);border-color:var(--primary-2)}
.chip.sent{border-radius:11px;padding:8px 11px;white-space:normal;text-align:left;line-height:1.4;max-width:100%}
.chip .warn{color:var(--yellow);font-weight:800}
.chip.on .warn{color:#fff}
textarea.input{width:100%;min-height:64px;resize:vertical;line-height:1.5}
textarea.input.detail{min-height:48px;margin-top:8px;font-size:12.5px}
.gold{border:1.5px solid var(--yellow);background:#fffdf3}
.hint{font:500 11px/1.4 var(--font);color:var(--mute);margin-top:4px}

/* ── CSKH editor ── */
.editor{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.editor{grid-template-columns:1fr}}
.draft-box{background:var(--cream);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font:500 12.5px/1.6 var(--font);color:var(--ink-soft)}
.draft-box b{color:var(--primary-2)}
.ln{margin-bottom:12px}
.ln label{font:700 11px/1 var(--font);text-transform:uppercase;letter-spacing:.05em;color:var(--mute);display:block;margin-bottom:5px}
.voice-warn{font:600 11px/1.4 var(--font);color:#c5421c;margin-top:4px}
.copy-block{background:#10241a;color:#d7ffe6;border-radius:12px;padding:14px;font:500 12px/1.6 'Be Vietnam Pro',monospace;white-space:pre-wrap;margin-top:10px}
.linkbox{display:flex;gap:8px;margin-top:8px;align-items:center}
.linkbox input{flex:1;font-size:11.5px;color:var(--blue)}

/* ── KPI ── */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .n{font:800 26px/1 var(--font-d);color:var(--primary-2)}
.kpi .l{font:600 11px/1.3 var(--font);color:var(--mute);margin-top:4px}

/* ── table ── */
table.tb{width:100%;border-collapse:collapse;font:500 12px/1.4 var(--font)}
table.tb th{text-align:left;font:700 10.5px/1 var(--font);text-transform:uppercase;color:var(--mute);padding:8px 10px;border-bottom:1px solid var(--line)}
table.tb td{padding:9px 10px;border-bottom:1px solid var(--line-soft)}

/* ── modal/toast ── */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--green);color:#fff;padding:12px 20px;border-radius:12px;font:600 13px/1.4 var(--font);
  z-index:9999;transition:.25s;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(58,30,10,.18)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal-bg{position:fixed;inset:0;background:rgba(40,25,12,.45);backdrop-filter:blur(3px);z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--card);border-radius:10px;padding:22px;max-width:520px;width:100%;box-shadow:0 18px 48px rgba(42,32,22,.2);max-height:88vh;overflow:auto}
.modal h3{font:800 17px/1.2 var(--font-d);color:var(--primary-2);margin:0 0 12px}
.modal.wide{max-width:760px}

/* ── CSKH editor v2 ── */
.msg-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.msg-head h3{margin:0}
.msg-context{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:14px}
.ctx-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctx-dim{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 9px;font:600 11px/1 var(--font);color:var(--ink-soft)}
.ctx-dim b{font-weight:800}
.ctx-dim.lo b{color:var(--primary-2)} .ctx-dim.mid b{color:var(--yellow)} .ctx-dim.hi b{color:var(--green)}
.ctx-mood{background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 9px;font:600 11px/1 var(--font)}
.ctx-obs{margin-top:8px;font:500 12.5px/1.55 var(--font);color:var(--ink);background:#fffdf3;border-left:3px solid var(--yellow);padding:7px 11px;border-radius:0 8px 8px 0}
.ctx-obs .lbl{font:800 10px/1 var(--font);color:#b8860b;letter-spacing:.04em;display:block;margin-bottom:3px}
.ctx-sent{margin-top:6px;font:500 12px/1.5 var(--font);color:var(--ink-soft)}
.lesson-hint{margin-top:10px}
.lesson-card{background:#eef6fb;border:1px solid #cfe3f2;border-radius:12px;padding:9px 12px;font:500 12.5px/1.45 var(--font);color:#2f6ea0}
.lesson-card b{font:800 13px/1.3 var(--font-d);color:#2f6ea0;display:block}
.lesson-card .sk{margin-top:3px;color:#3a7fb5}
.return-banner{background:#fff3e8;border:1px solid #f3c8a8;border-left:4px solid var(--primary-2);border-radius:0 10px 10px 0;padding:10px 13px;margin-bottom:14px;font:500 13px/1.55 var(--font);color:var(--ink)}
.wk-out{border-top:1px dashed #d7e8c2;padding-top:10px}
.wk-edit textarea{width:100%;min-height:44px;margin:2px 0 8px;line-height:1.55}
.wk-lbl{display:block;font:700 11.5px/1.3 var(--font);color:var(--ink-soft);margin-top:4px}
/* khối tiêu chí 2 màu — phân biệt "làm được" / "chưa được" tức thì */
.ln.sec-strength{background:#f3fae9;border:1px solid #d7ecb8;border-left:4px solid var(--green);border-radius:0 12px 12px 0;padding:11px 13px}
.ln.sec-strength label{color:#4a901f}
.ln.sec-improve{background:#fff5ec;border:1px solid #f5d9c0;border-left:4px solid var(--primary-2);border-radius:0 12px 12px 0;padding:11px 13px}
.ln.sec-improve label{color:var(--primary-2)}
/* thanh hành động dán đáy bottom-sheet */
.modal-actions{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;background:var(--card);margin:8px -22px -22px;padding:12px 22px;border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(58,30,10,.05)}
/* xem trước dạng bong bóng Zalo */
.zalo-prev{margin-top:14px}
.zb-head{font:700 10.5px/1 var(--font);color:var(--mute);letter-spacing:.04em;margin-bottom:6px}
.zb-bubble{background:#d8f1ff;border:1px solid #b9e3fb;border-radius:14px 14px 14px 4px;padding:11px 13px;max-width:92%}
.zb-line{display:flex;gap:7px;align-items:flex-start;margin:0 0 6px}
.zb-line:last-child{margin-bottom:0}
.zb-line span{font-size:13px;flex:none;line-height:1.5}
.zb-line p{margin:0;font:500 12.5px/1.5 var(--font);color:var(--ink)}
.zb-line.b p{color:#2f6ea0}
/* skeleton loading */
.skel{display:inline-block;background:linear-gradient(90deg,#eee2d2 25%,#f6efe4 37%,#eee2d2 63%);background-size:400% 100%;animation:skel 1.2s ease infinite;border-radius:6px}
@keyframes skel{0%{background-position:100% 0}100%{background-position:-100% 0}}
.skel-row{pointer-events:none}
.skel-av{width:40px;height:40px;border-radius:50%}
.skel-line{height:12px}
.skel-pill{width:54px;height:20px;border-radius:99px}
/* empty state */
.empty-state{text-align:center;padding:30px 18px;color:var(--ink-soft)}
.empty-state .es-icon{font-size:40px;line-height:1}
.empty-state .es-title{font:800 14px/1.4 var(--font-d);color:var(--ink);margin:8px 0 3px}
.empty-state .es-sub{font:500 12.5px/1.55 var(--font);color:var(--mute);max-width:340px;margin:0 auto 12px}
/* phone chip (chạm copy) */
.phone-chip{font:700 11px/1 var(--font);color:#2f6ea0;background:#eaf3fb;border:1px solid #c4ddf2;border-radius:99px;padding:5px 9px;cursor:pointer;white-space:nowrap}
.phone-chip:hover{background:#dcecfa}
/* điểm danh nhanh */
.qa-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);font:600 13px/1.3 var(--font);cursor:pointer}
.qa-row span:first-child{display:flex;align-items:center;gap:8px}
.qa-switch{font:600 12px/1 var(--font);color:var(--primary-2);white-space:nowrap;display:flex;align-items:center;gap:5px}
#qa-list{max-height:48vh;overflow:auto;margin:0 -4px}
/* dashboard */
.kpi.click{cursor:pointer;transition:transform .1s, box-shadow .1s}
.kpi.click:hover{box-shadow:0 2px 4px rgba(42,32,22,.06)}
.funnel{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#f0e8d8}
.funnel div{transition:width .4s}
.funnel-legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:9px;font:600 11px/1.3 var(--font);color:var(--ink-soft)}
.funnel-legend span{display:inline-flex;align-items:center;gap:5px}
.funnel-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.pb-done{animation:pb-pulse 1.1s ease}
@keyframes pb-pulse{0%,100%{filter:none}50%{filter:brightness(1.15)}}
/* THANH ĐIỀU HƯỚNG ĐÁY (mobile, vai trò ít tab) — ở cấp body để không bị backdrop-filter của topbar "giữ" lại */
.bottomnav{display:none}
@media (max-width:640px){
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:8000;padding:5px 8px;padding-bottom:calc(5px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -3px 14px rgba(58,30,10,.08);justify-content:space-around;gap:6px}
  .bottomnav button{flex:1 1 0;font:700 12.5px/1.2 var(--font);padding:11px 8px;border:none;background:transparent;border-radius:12px;text-align:center;color:var(--ink-soft);cursor:pointer}
  .bottomnav button.active{background:#fff3e8;color:var(--primary-2)}
  body.has-bottomnav .nav{display:none}          /* ẩn nav trên cùng, dùng thanh đáy */
  body.has-bottomnav .wrap{padding-bottom:84px}
}

.ed-line{margin-bottom:13px}
.ed-head{display:flex;justify-content:space-between;align-items:baseline;font:800 12.5px/1 var(--font-d);color:var(--ink);margin-bottom:6px}
.ed-head .cc{font:600 10.5px/1 var(--font);color:var(--mute)}
.msg-edit textarea{width:100%;min-height:58px;line-height:1.65;font-size:14px;overflow:hidden;resize:none;padding:10px 12px}
.msg-edit textarea:disabled{background:#faf6ee;color:var(--ink-soft)}
.zalo-meter{font:600 11.5px/1.4 var(--font);padding:8px 11px;border-radius:9px;margin:4px 0 2px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.zalo-ok{background:#eaf7e0;color:#46901f} .zalo-long{background:#fff3cd;color:#8a6d1a}
.ref-draft{margin-top:8px;border:1px solid var(--line);border-radius:11px;background:#fffdf9;overflow:hidden}
.ref-draft summary{cursor:pointer;font:700 12px/1 var(--primary-2);padding:11px 13px;list-style:none;user-select:none}
.ref-draft summary::-webkit-details-marker{display:none}
.ref-draft summary::before{content:'▸';color:var(--mute);margin-right:6px;display:inline-block}
.ref-draft[open] summary::before{content:'▾'}
.ref-draft .ref-body{padding:0 13px 12px}

const DB = window.CTRC_DB, ENG = window.CTRC_ENGINE, CFG = window.CTRC_CONFIG;
const $ = (s, r = document) => r.querySelector(s);
const view = $('#view');
let CENTER = null, STAFF = null, TAB = null;

function toast(msg, color) {
  const t = $('#toast'); t.textContent = msg; t.style.background = color || 'var(--green)';
  t.classList.add('show'); clearTimeout(window._tt); window._tt = setTimeout(() => t.classList.remove('show'), 2800);
}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function modal(html, cls) {
  const root = $('#modal-root');
  root.innerHTML = `<div class="modal-bg" onclick="if(event.target===this)CTRC.closeModal()"><div class="modal ${cls||''}">${html}</div></div>`;
}
let EDITING_MSG = null;   // id tin CSKH đang giữ lock (để nhả khi đóng)
async function closeModal(){
  const editId = EDITING_MSG; EDITING_MSG = null;
  // giữ nháp CHẤM dở của GV (chống mất khi lỡ chạm nền / bấm Huỷ)
  if (SCORE && SCORE.stu && $('#score-body')) {
    try { syncScoreForm(); } catch(_){}
    const k = _scoreKey(SCORE.stu.id);
    if (_hasScoreWork(SCORE.rec)) { SCORE_DRAFTS[k] = JSON.parse(JSON.stringify(SCORE.rec)); toast('Đã giữ nháp chấm dở — mở lại bé này là còn nguyên','var(--blue)'); }
    else delete SCORE_DRAFTS[k];
  }
  SCORE = null;
  // đọc nháp đang sửa (nếu editor còn mở) để KHÔNG mất công sửa
  let edits = null;
  if (editId && $('#m-dm')) edits = readEdits();
  $('#modal-root').innerHTML = '';
  if (editId){
    try {
      const cur = await DB.getMessageById(editId);
      if (cur && cur.status === 'cs_editing' && cur.lock_owner === STAFF.id){
        const patch = { status:'waiting_cs', lock_owner:null, lock_at:null };
        if (edits && (edits.diem_manh || edits.co_gang || edits.goi_y)) Object.assign(patch, edits);
        await DB.updateMessageGuarded(editId, cur.version, patch);  // nhả lock + lưu nháp
      }
    } catch(_){}
    if ($('#q-list')) loadQueue();
  }
}

supabaseAnonKey:'eyJhbG...'  (anon public key)</div>

    <div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn primary" onclick="CTRC.closeModal()">Đã hiểu</button></div>`);
}

function avBg(name){ let h=0; const s=String(name||''); for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return `hsl(${h%360},62%,89%)`; }
function avatar(stu, size){ const sz=size?`width:${size}px;height:${size}px;font-size:${Math.round(size*0.5)}px;`:''; return `<span class="av" style="background:${avBg(stu.name)};${sz}">${AV(stu.gender)}</span>`; }
/* khung xương khi đang tải (mượt hơn chữ "Đang tải…") */

/* SĐT phụ huynh — chạm để copy (CSKH dán vào Zalo) */
/* Copy đa trình duyệt. Nhiều máy CHẶN quyền clipboard-write (navigator.clipboard ném NotAllowedError)
   → dự phòng execCommand('copy') chạy đồng bộ trong cùng cú chạm, không cần quyền đó. Trả Promise<bool>. */
function clipCopy(text){
  text = (text==null?'':String(text));
  let ok=false;
  try{
    const ta=document.createElement('textarea');
    ta.value=text; ta.setAttribute('readonly','');
    ta.style.cssText='position:fixed;top:-9999px;left:-9999px;opacity:0';
    document.body.appendChild(ta);
    ta.focus(); ta.select(); try{ ta.setSelectionRange(0,text.length); }catch(_){}
    ok=document.execCommand('copy');
    document.body.removeChild(ta);
  }catch(_){ ok=false; }
  if(ok) return Promise.resolve(true);
  if(navigator.clipboard&&navigator.clipboard.writeText){
    return navigator.clipboard.writeText(text).then(()=>true).catch(()=>false);
  }
  return Promise.resolve(false);
}
async function copyPhone(num){ const ok=await clipCopy(num); if(ok) toast('📋 Đã copy SĐT '+num); else toast('Bôi đen để copy: '+num,'var(--primary-2)'); }
function phoneChip(stu){ const p=(stu&&stu.parent_phone||'').trim(); return p?`<button class="phone-chip" onclick="event.stopPropagation();CTRC.copyPhone('${esc(p)}')" title="Chạm để copy">📞 ${esc(p)}</button>`:''; }

function reportCfg(raw){
  const c=Object.assign({}, REPORT_CFG_DEFAULT, raw||{});
  const p=Object.assign({tone:[],detail:[],audience:[]}, (raw&&raw.presets)||{});
  ['tone','detail','audience'].forEach(k=>{ p[k]=Array.from(new Set((p[k]||[]).map(x=>String(x||'').trim()).filter(Boolean))); });
  c.presets=p;
  return c;
}
function reportConfigValue(map, val){ return map[val] || val || ''; }
function reportPresetMap(kind){ return kind==='tone'?REPORT_TONE:(kind==='detail'?REPORT_DETAIL:REPORT_AUDIENCE); }
function reportPresetValues(kind, cfg){
  const base=Object.values(reportPresetMap(kind));
  const custom=((cfg&&cfg.presets&&cfg.presets[kind])||[]).filter(Boolean);
  return Array.from(new Set(base.concat(custom)));
}
function reportIsDefaultPreset(kind, val){ return Object.values(reportPresetMap(kind)).includes(val); }

/* prompt BÁO CÁO TUẦN: gom các buổi của 1 bé → tổng hợp đầy đủ cho phụ huynh */
function buildWeeklyPrompt(b){
  const stu=b.student||{}, center=b.center||{}, les=b.lesson||null;
  const recs=(b.records||[]).filter(r=>r.attendance==='present');
  const sessions = recs.map((r,i)=>{
    const st=r.strength||{}, im=r.improve||{};
    return `• Buổi ${i+1}: LÀM ĐƯỢC = ${_critLabel(st.crit)} ("${st.sentence||''}"${st.detail?'; chi tiết: '+st.detail:''}); CHƯA ĐƯỢC = ${_critLabel(im.crit)} ("${im.sentence||''}"${im.detail?'; chi tiết: '+im.detail:''})${r.mood?'; tâm trạng: '+((window.MOODS&&MOODS[r.mood])||r.mood):''}.`;
  }).join('\n');
  const selectedSessions = les ? (les.session_range || (Array.isArray(les.sessions)&&les.sessions.length ? 'Buổi '+les.sessions.join(' & ') : '')) : '';
  const sessionItems = (les&&Array.isArray(les.session_items)) ? les.session_items.map(si=>['Buổi '+si.no, si.summary||si.title||si.skill].filter(Boolean).join(': ')).join('; ') : '';
  const lesLine = (les&&(les.title||les.content||les.objective||les.activity||selectedSessions||sessionItems))?[
    `NỘI DUNG HỌC TUẦN (dùng làm bối cảnh cho cả nhận xét, KHÔNG viết lại nguyên văn trong tongHop):`,
    selectedSessions?`- Buổi thực học được chọn: ${selectedSessions}`:'',
    sessionItems?`- Tóm tắt từng buổi được chọn: ${sessionItems}`:'',
    les.content?`- Bản phụ huynh đang dùng: "${les.content}"`:'',
    les.title?`- Tên bài/chủ đề: ${les.title}`:'',
    les.objective?`- Mục tiêu: ${les.objective}`:'',
    les.activity?`- Hoạt động: ${les.activity}`:'',
  ].filter(Boolean).join('\n'):'';
  return [
    `Trung tâm TƯ DUY ${center.name||'WonderKids'}. Soạn BÁO CÁO TUẦN gửi phụ huynh cho bé ${stu.name}, TỔNG HỢP từ ${recs.length} buổi trong tuần.`,
    lesLine,
    `DỮ LIỆU TỪNG BUỔI (giáo viên ghi):`,
    sessions||'(chưa có buổi nào)',
    b.childComment?`Lời nhắn riêng của cô: "${b.childComment}".`:'',
    '',
    reportConfigPrompt(center.report_config),
    '',
    selectedSessions?`Khi liên hệ nhận xét với bài học, CHỈ dùng các buổi thực học đã chọn (${selectedSessions}); không kéo hoạt động của buổi khác.`:'',
    `Viết 2 phần nhận xét ẤM ÁP, CỤ THỂ, ĐẦY ĐỦ — bám dữ liệu GV là chính, dùng nội dung/buổi học làm bối cảnh để nhận xét đúng bài:`,
    `1. tongHop: 2-3 câu cho mục "ĐIỂM BÉ LÀM ĐƯỢC" — nêu rõ con thể hiện tốt ở đâu, hành vi cụ thể nào, liên hệ nhẹ với hoạt động/kỹ năng tư duy nếu phù hợp. KHÔNG lặp lại toàn bộ nội dung học tuần.`,
    `2. coGang: 2-3 câu cho mục "ĐIỂM BÉ CẦN HỖ TRỢ" — nêu rõ điểm cần rèn thêm, tích cực và hướng tới trước, kèm cách cô/trung tâm sẽ đồng hành.`,
    `Quy tắc: KHÔNG dùng từ kém/yếu/tệ/chậm/dốt/lười/hư; KHÔNG so sánh với bé khác; tiếng Việt tự nhiên, hướng tới trước.`,
    `Trả về DUY NHẤT JSON: {"tongHop":"...","coGang":"..."} — không thêm chữ nào khác.`,
  ].filter(Boolean).join('\n');
}

const AI = {
  KEY:'ctrc:ai:v1',
  DEFAULT_MODELS:[
    {id:'claude-opus-4-1',        name:'Claude Opus 4.1 — mạnh nhất'},
    {id:'claude-sonnet-4-5',      name:'Claude Sonnet 4.5 — cân bằng (khuyên dùng)'},
    {id:'claude-3-5-haiku-latest',name:'Claude Haiku 3.5 — nhanh, tiết kiệm'},
  ],
  GEMINI_MODELS:[
    {id:'gemini-3.5-flash',       name:'Gemini 3.5 Flash — nhanh, mạnh (khuyên dùng)'},
    {id:'gemini-3.1-pro',         name:'Gemini 3.1 Pro — suy luận sâu nhất'},
    {id:'gemini-3.1-flash-lite',  name:'Gemini 3.1 Flash-Lite — rẻ nhất'},
    {id:'gemini-flash-latest',    name:'Gemini Flash (bản mới nhất)'},
  ],
  GEMINI_BASE:'https://generativelanguage.googleapis.com',
  ANTHROPIC_BASE:'https://api.anthropic.com',
  // mức effort (output_config.effort) — đúng giá trị API. Model mới: adaptive + effort;
  // model cũ: enabled + budget_tokens (quy đổi từ effort).
  THINKING_LEVELS:['off','low','medium','high','xhigh','max'],
  THINKING_LABEL:{ off:'Tắt (nhanh nhất)', low:'Thấp', medium:'Vừa', high:'Cao (mặc định)', xhigh:'Rất cao (xhigh)', max:'Tối đa (max)' },
  EFFORT_BUDGET:{ low:2048, medium:6144, high:12288, xhigh:20000, max:32000 },   // map cho model cũ (enabled)
  EFFORT_MAXTOK:{ low:4000, medium:8000, high:16000, xhigh:32000, max:48000 },   // room cho adaptive/effort
  // quy tắc nạp từ ctrc/rules/*.md (sửa file là AI bám theo)
  _rules:{voice:'',perbuoi:'',weekly:'',giaoan:''},
  async loadRules(){
    const get=async n=>{ try{ const r=await fetch('rules/'+n+'.md',{cache:'no-store'}); return r.ok?await r.text():''; }catch(_){ return ''; } };
    this._rules.voice  = await get('giong-thuong-hieu');
    this._rules.perbuoi= await get('bao-cao-per-buoi');
    this._rules.weekly = await get('bao-cao-tuan');
    this._rules.giaoan = await get('doc-hieu-giao-an');
  },
  _sysFor(kind, baseOverride){
    let s = baseOverride || AI_SYSTEM;
    if(this._rules.voice)   s += '\n\n--- GIỌNG THƯƠNG HIỆU (rules, bám sát) ---\n'+this._rules.voice;
    if(kind==='perbuoi' && this._rules.perbuoi) s += '\n\n--- QUY TẮC BÁO CÁO PER-BUỔI ---\n'+this._rules.perbuoi;
    if(kind==='weekly'  && this._rules.weekly)  s += '\n\n--- QUY TẮC BÁO CÁO TUẦN ---\n'+this._rules.weekly;
    return s;
  },
  get(){
    const base = Object.assign({
      provider:'anthropic', mode: (CFG.edgeFnUrl?'edge':'edge'),
      edgeFnUrl: CFG.edgeFnUrl||'', apiKey:'', model:'claude-sonnet-4-5',
      maxTokens:600, thinking:'off', baseUrl:this.ANTHROPIC_BASE,
    }, (CFG.ai||{}));
    let saved={}; try{ saved=JSON.parse(localStorage.getItem(this.KEY))||{}; }catch(_){}
    const c = Object.assign(base, saved);
    // danh sách model gợi ý + base URL tự khớp đúng hãng (trừ khi đã tải thật từ API)
    if(!c.models || c.modelsSource!=='API') c.models = this._isGemini(c) ? this.GEMINI_MODELS.slice() : this.DEFAULT_MODELS.slice();
    if(this._isGemini(c)){ if(!c.baseUrl || /anthropic/i.test(c.baseUrl)) c.baseUrl=this.GEMINI_BASE; }
    else if(/googleapis/i.test(c.baseUrl||'')) c.baseUrl=this.ANTHROPIC_BASE;
    return c;
  },
  save(cfg){ try{ localStorage.setItem(this.KEY, JSON.stringify(cfg)); }catch(e){ toast('Lưu cấu hình lỗi','var(--primary-2)'); } },
  usable(){ const c=this.get(); return c.mode==='edge' ? !!c.edgeFnUrl : !!c.apiKey; },
  _directHeaders(c){ return {'content-type':'application/json','x-api-key':c.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'}; },
  /* provider = gemini? (theo cấu hình hoặc suy từ tên model) */
  _isGemini(c){ return (c && c.provider==='gemini') || /gemini/i.test((c&&c.model)||''); },
  /* gọi Gemini generateContent (chế độ trực tiếp). Gemini 3.x là model "suy nghĩ":
     effort=off → thinkingBudget 0 (kẻo phần nghĩ thầm nuốt hết token trả lời);
     effort>off → cấp thêm budget và nới maxOutputTokens cho đủ chỗ cả nghĩ lẫn trả lời. */
  async _callGemini(c, system, content){
    const eff = c.thinking || 'off';
    const think = eff==='off' ? 0 : (this.EFFORT_BUDGET[eff] || 6144);
    const out = c.maxTokens || 600;
    let base = (c.baseUrl||'').trim().replace(/\/+$/,'');
    if(!base || /anthropic/i.test(base)) base = this.GEMINI_BASE;   // né base URL còn sót của Anthropic
    const url = base + '/v1beta/models/' + encodeURIComponent(c.model) + ':generateContent';
    const body = {
      contents:[{role:'user', parts:[{text:content}]}],
      generationConfig:{ maxOutputTokens: out + think, thinkingConfig:{ thinkingBudget: think } },
    };
    if(system) body.systemInstruction = { parts:[{text:system}] };
    const r = await fetch(url, {method:'POST', headers:{'content-type':'application/json','x-goog-api-key':c.apiKey}, body:JSON.stringify(body)});
    if(!r.ok) throw new Error('Gemini HTTP '+r.status+': '+(await r.text()).slice(0,180));
    return r.json();
  },
  /* model mới (4.6+/4.7/4.8/mythos) → adaptive + output_config.effort; còn lại → enabled+budget */
  _isAdaptive(model){ return /(opus-4-(6|7|8|9))|(sonnet-4-(6|7|8|9))|mythos/i.test(model||''); },
  /* danh sách body-variant để thử theo thứ tự (có fallback) */
  _variants(c){
    const eff = c.thinking || 'off', out = c.maxTokens || 600;
    const plain = { max_tokens: out };
    if(eff==='off') return [plain];
    const adaptive = { thinking:{type:'adaptive'}, output_config:{effort:eff}, max_tokens: this.EFFORT_MAXTOK[eff]||16000 };
    const enabled  = { thinking:{type:'enabled', budget_tokens:this.EFFORT_BUDGET[eff]||6144}, max_tokens:(this.EFFORT_BUDGET[eff]||6144)+out };
    return this._isAdaptive(c.model) ? [adaptive, enabled, plain] : [enabled, adaptive, plain];
  },
  /* gọi /v1/messages, thử lần lượt các variant; lỗi 400 liên quan thinking/effort → thử variant kế */
  async _callMessages(c, system, content){
    if(this._isGemini(c)) return this._callGemini(c, system, content);
    let lastErr;
    for(const v of this._variants(c)){
      const body = Object.assign({ model:c.model, system, messages:[{role:'user',content}] }, v);
      const r = await fetch(c.baseUrl+'/v1/messages',{method:'POST',headers:this._directHeaders(c),body:JSON.stringify(body)});
      if(r.ok) return r.json();
      const txt = await r.text();
      lastErr = 'Anthropic HTTP '+r.status+': '+txt.slice(0,180);
      if(!(r.status===400 && /thinking|adaptive|enabled|budget|effort|output_config/i.test(txt))) throw new Error(lastErr);
    }
    throw new Error(lastErr || 'AI lỗi');
  },
  /* lấy đúng khối text (bỏ qua khối thinking nếu có) */
  _text(d){
    if(!d) return '';
    if(d.candidates){   // khuôn Gemini: candidates[0].content.parts[].text (bỏ phần nghĩ thầm)
      const parts = (((d.candidates[0]||{}).content||{}).parts) || [];
      return parts.filter(p=>p && p.text && !p.thought).map(p=>p.text).join('').trim();
    }
    if(!d.content) return '';
    const t = d.content.find(b=>b.type==='text');
    return t ? (t.text||'').trim() : ((d.content[0]&&d.content[0].text)||'').trim();
  },
  async listModels(cfg){
    const c=cfg||this.get();
    if(c.mode==='edge'){
      if(!c.edgeFnUrl) throw new Error('Chưa có Edge Function URL');
      const r=await fetch(c.edgeFnUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'list_models'})});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const d=await r.json(); return (d.data||d.models||[]).map(m=>({id:m.id,name:m.display_name||m.id}));
    }
    if(!c.apiKey) throw new Error('Chưa có API key');
    if(this._isGemini(c)){
      let base=(c.baseUrl||'').trim().replace(/\/+$/,''); if(!base||/anthropic/i.test(base)) base=this.GEMINI_BASE;
      const r=await fetch(base+'/v1beta/models?pageSize=200',{headers:{'x-goog-api-key':c.apiKey}});
      if(!r.ok) throw new Error('HTTP '+r.status+': '+(await r.text()).slice(0,140));
      const d=await r.json();
      return (d.models||[])
        .filter(m=>!m.supportedGenerationMethods || m.supportedGenerationMethods.includes('generateContent'))
        .map(m=>({id:(m.name||'').replace(/^models\//,''), name:m.displayName||(m.name||'').replace(/^models\//,'')}))
        .filter(m=>m.id);
    }
    const r=await fetch(c.baseUrl+'/v1/models?limit=100',{headers:this._directHeaders(c)});
    if(!r.ok) throw new Error('HTTP '+r.status+': '+(await r.text()).slice(0,140));
    const d=await r.json(); return (d.data||[]).map(m=>({id:m.id,name:m.display_name||m.id}));
  },
  async generate(payload, cfg){
    const c=cfg||this.get();
    if(c.mode==='edge'){
      if(!c.edgeFnUrl) throw new Error('Chưa có Edge Function URL');
      const r=await fetch(c.edgeFnUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({model:c.model,max_tokens:c.maxTokens,thinking_effort:c.thinking},payload))});
      if(!r.ok) throw new Error('Edge HTTP '+r.status);
      return r.json();
    }
    if(!c.apiKey) throw new Error('Chưa có API key');
    const d=await this._callMessages(c, this._sysFor('perbuoi'), buildAIPrompt(payload));
    const text=this._text(d);
    const m=text.match(/\{[\s\S]*\}/); let out={}; if(m){try{out=JSON.parse(m[0]);}catch(_){}}
    if(!out.diem_manh) out={diem_manh:text,co_gang:'',goi_y:''};
    return out;
  },
  /* Tổng hợp BÁO CÁO TUẦN bằng AI từ các buổi của 1 bé → {tongHop, coGang, oNha} */
  async generateWeekly(payload, cfg){
    const c=cfg||this.get();
    if(c.mode==='edge'){
      if(!c.edgeFnUrl) throw new Error('Chưa có Edge Function URL');
      const r=await fetch(c.edgeFnUrl,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({kind:'weekly',model:c.model,max_tokens:c.maxTokens,thinking_effort:c.thinking},payload))});
      if(!r.ok) throw new Error('Edge HTTP '+r.status);
      return r.json();
    }
    if(!c.apiKey) throw new Error('Chưa có API key');
    const d=await this._callMessages(c, this._sysFor('weekly'), buildWeeklyPrompt(payload));
    const text=this._text(d);
    const m=text.match(/\{[\s\S]*\}/); let out={}; if(m){try{out=JSON.parse(m[0]);}catch(_){}}
    return out;
  },
  /* gọi Claude tổng quát (cho Insights + trợ lý GV). Trả về text. */
  async complete(system, prompt, cfg){
    const c=cfg||this.get();
    if(c.mode==='edge'){
      if(!c.edgeFnUrl) throw new Error('Chưa có Edge Function URL');
      const r=await fetch(c.edgeFnUrl,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({action:'complete',system,prompt,model:c.model,max_tokens:c.maxTokens,thinking_effort:c.thinking})});
      if(!r.ok) throw new Error('Edge HTTP '+r.status);
      const d=await r.json(); return d.text||'';
    }
    if(!c.apiKey) throw new Error('Chưa có API key');
    const d=await this._callMessages(c, this._sysFor('generic', system), prompt);
    return this._text(d);
  },
};

    // Gọi mạng THẬT đầu tiên nằm ở đây — trước đây không được bảo vệ nên cả boot chết câm.
    CENTER = await DB.getCenter();

    if (mode==='demo') $('#demo-banner').classList.remove('hidden');
    if (forced){
      const b=$('#demo-banner');
      if(b) b.innerHTML = '🟠 <b>Chế độ thử</b> — dữ liệu chỉ nằm trên máy này, KHÔNG lên hệ thống chung. <a href="#" onclick="CTRC.exitDemoMode();return false;">Thoát chế độ thử &amp; kết nối lại →</a>';
    }
    // tự dọn lock "CS đang sửa" bị kẹt (demo: tất cả; supabase: chỉ lock cũ >15')
    if (CENTER) { try { await DB.healLocks(CENTER.id, mode==='demo'); } catch(e){ console.warn('[boot] healLocks lỗi (bỏ qua):', e); } }
    AI.loadRules().catch(()=>{});   // nạp quy tắc từ rules/*.md để AI bám theo
    // session đã đăng nhập?
    const saved = sessionStorage.getItem('ctrc:staff');
    if (saved){ try { STAFF = JSON.parse(saved); enterApp(); return; } catch(_){} }
    await renderLogin();
    if (!CENTER) bootFail(new Error('Không tìm thấy trung tâm nào trong dữ liệu'));
  } catch(e){
    console.error('[boot] lỗi nghiêm trọng:', e);

/* Bài đang học của từng lớp (nhớ theo máy) → nối thư viện giáo án vào chấm buổi */
const CLASS_LESSON = {
  KEY:'ctrc:classlesson:v1',
  all(){ try{ return JSON.parse(localStorage.getItem(this.KEY))||{}; }catch(_){ return {}; } },
  get(classId){ return this.all()[classId]||null; },
  setObj(classId, obj){ const m=this.all(); if(obj){ m[classId]=obj; } else { delete m[classId]; } try{ localStorage.setItem(this.KEY, JSON.stringify(m)); }catch(_){} },
};
/* ═══ THƯ VIỆN MỤC TIÊU TUẦN — nhóm CHƯƠNG TRÌNH→CUỐN→TUẦN (seed objectives.js + override localStorage) ═══
   Mã cuốn là DUY NHẤT toàn hệ thống (201..410+, B1-1.., J1..) → API get/set theo book, override phẳng. */
const OBJ = {
  KEY:'ctrc:objectives:v2',
  _flat:null,
  seed(){ return window.CTRC_OBJECTIVES || {}; },                       // {program:{book:{week}}}
  overrides(){ try{ return JSON.parse(localStorage.getItem(this.KEY))||{}; }catch(_){ return {}; } }, // {book:{week}}
  flat(){ if(!this._flat){ const s=this.seed(), map={}, prog={}; for(const p in s){ for(const b in s[p]){ map[b]=s[p][b]; prog[b]=p; } } this._flat={map,prog}; } return this._flat; },
  programs(){ return Object.keys(this.seed()); },
  programOf(book){ return this.flat().prog[book] || ''; },
  booksOf(program){ return Object.keys(this.seed()[program]||{}); },
  allBooks(){ return Array.from(new Set(Object.keys(this.flat().map).concat(Object.keys(this.overrides())))); },
  get(book, week){ const o=this.overrides(); if(o[book]&&o[book][week]!=null) return o[book][week]; const f=this.flat().map[book]; return (f&&f[week])||''; },
  isEdited(book, week){ const o=this.overrides(); return !!(o[book]&&o[book][week]!=null); },
  set(book, week, text){ const o=this.overrides(); (o[book]=o[book]||{})[week]=text; try{ localStorage.setItem(this.KEY, JSON.stringify(o)); }catch(e){ toast('Lưu lỗi (bộ nhớ đầy?)','var(--primary-2)'); } },
  reset(book, week){ const o=this.overrides(); if(o[book]){ delete o[book][week]; if(!Object.keys(o[book]).length) delete o[book]; localStorage.setItem(this.KEY, JSON.stringify(o)); } },
};

/* kỹ năng tóm tắt từ 1 BÀI TRONG THƯ VIỆN (dùng khi điền sẵn) */
function lessonSkillsText(les){
  if(!les) return '';
  if(les.thinking_skills && les.thinking_skills.length) return les.thinking_skills.join(', ');
  if(les.pages && les.pages.length){ const t=Array.from(new Set(les.pages.map(p=>p.type).filter(Boolean))); if(t.length) return t.join(', '); }
  return les.skill||'';
}
/* gộp "nội dung học theo tuần" → BLOCK NHIỀU DÒNG, dễ đọc trong tin Zalo:
   • Bài: …
   • Mục tiêu: …
   • Hoạt động:
      – …
      – … */
function _cleanObjective(s){ return (s||'').replace(/^\s*mục\s*tiêu[^:]*:\s*/i,'').replace(/\s+/g,' ').trim().replace(/\.$/,''); }
function _activityLines(s){ return (s||'').split(/\n|;/).map(x=>x.replace(/^[•\-–\s]+/,'').trim()).filter(Boolean); }
function lessonContentText(cl){
  if(!cl) return '';
  const lines=[];
  const title=(cl.title||'').replace(/\.$/,'').trim();
  if(title) lines.push('• Bài: '+title);
  const obj=_cleanObjective(cl.objective);
  if(obj) lines.push('• Mục tiêu: '+obj);
  const acts=_activityLines(cl.activity);
  if(acts.length>1){ lines.push('• Hoạt động:'); acts.forEach(a=>lines.push('   – '+a)); }
  else if(acts.length===1){ lines.push('• Hoạt động: '+acts[0]); }
  return lines.join('\n');
}
function lessonSessionsOfBook(book){
  const out={};
  Object.values(LESSONS()).filter(l=>String(l.code)===String(book)).forEach(l=>{
    (l.session_items||[]).forEach(si=>{ if(si && si.no!=null && !out[si.no]) out[si.no]=Object.assign({week:l.week, source_key:l.key||lessonKey(l.code,l.week)}, si); });
  });
  return Object.values(out).sort((a,b)=>(+a.no||0)-(+b.no||0));
}
function defaultSessionNos(book, week){
  const les=lessonByKey(lessonKey(book, week));
  const nums=les&&les.session_numbers&&les.session_numbers.length?les.session_numbers:((les&&les.session_items)||[]).map(s=>s.no);
  return nums.map(Number).filter(Boolean);
}
const WK_SESSION_PICK = {
  KEY:'ctrc:weekly-session-pick:v1',
  all(){ try{ return JSON.parse(localStorage.getItem(this.KEY))||{}; }catch(_){ return {}; } },
  get(key){ const m=this.all(); return Array.isArray(m[key])?m[key].map(Number).filter(Boolean):null; },
  set(key, arr){ const m=this.all(); m[key]=Array.from(new Set((arr||[]).map(Number).filter(Boolean))).sort((a,b)=>a-b); localStorage.setItem(this.KEY, JSON.stringify(m)); },
  remove(key){ const m=this.all(); delete m[key]; localStorage.setItem(this.KEY, JSON.stringify(m)); },
};
function wkPickKey(){ return [WK.classId||'', WK.book||'', 'w'+(WK.week||1), WK.from||'', WK.to||''].join('::'); }
function wkSavedSessionNos(){ const key=wkPickKey(); return WK.sessionPick[key] || WK_SESSION_PICK.get(key); }
function wkSelectedSessionNos(){ const saved=wkSavedSessionNos(); return saved&&saved.length?saved.slice():defaultSessionNos(WK.book, WK.week); }
function wkToggleSession(no, checked){
  const key=wkPickKey(); let cur=(wkSavedSessionNos()||defaultSessionNos(WK.book, WK.week)).slice().map(Number).filter(Boolean);
  no=+no;
  cur=checked?Array.from(new Set(cur.concat([no]))):cur.filter(x=>x!==no);
  if(!cur.length){ toast('Cần giữ ít nhất 1 buổi thực học','var(--primary-2)'); renderWeeklyLesson(); return; }
  WK.sessionPick[key]=cur.sort((a,b)=>a-b);
  WK_SESSION_PICK.set(key, WK.sessionPick[key]);
  renderWeeklyLesson();
}
function wkResetSessions(){ const key=wkPickKey(); delete WK.sessionPick[key]; WK_SESSION_PICK.remove(key); renderWeeklyLesson(); }
function weeklyLessonSelection(){
  const base=lessonByKey(lessonKey(WK.book, WK.week));
  const all=lessonSessionsOfBook(WK.book);
  const pickKey=wkPickKey(); const custom=!!wkSavedSessionNos();
  if(!custom || !all.length) return { lesson:base, key:lessonKey(WK.book, WK.week), custom:false, nos:defaultSessionNos(WK.book, WK.week) };
  const nos=wkSelectedSessionNos();
  const selected=all.filter(si=>nos.includes(+si.no));
  if(!selected.length) return { lesson:base, key:lessonKey(WK.book, WK.week), custom:false, nos:defaultSessionNos(WK.book, WK.week) };
  const pages=[]; selected.forEach(si=>(si.pages||[]).forEach(p=>pages.push(Object.assign({},p,{range:(si.no?'Buổi '+si.no+' · ':'')+(p.range||'')}))));
  const summaries=selected.map(si=>`Buổi ${si.no}: ${si.summary||si.title||si.skill||'Nội dung buổi học'}`);
  const skills=Array.from(new Set(selected.map(si=>si.skill).filter(Boolean))).join(', ');
  const lesson={ code:WK.book, week:WK.week, title:'Cuốn '+WK.book+' · Buổi '+nos.join(' & '), sessions:selected.length,
    session_numbers:nos, session_range:'Buổi '+nos.join(' & '), session_items:selected, pages, skill:skills,
    knowledge:summaries.join('\n'), body:summaries, raw_text:summaries.join('\n'), source:'selected_sessions' };
  return { lesson, key:lessonKey(WK.book, WK.week)+'#b'+nos.join('-'), custom:true, nos };
}

async function saveQuickAttendance(){
  if(saveQuickAttendance._busy) return; saveQuickAttendance._busy=true;
  try{
    const inputs=[].slice.call(document.querySelectorAll('#qa-list input[data-sid]'));
    let nAbsent=0, nBack=0;
    for(const inp of inputs){
      const sid=inp.dataset.sid;
      const existed=await DB.getRecord(GV.session.id, sid);
      const pm=existed?await DB.getMessage(existed.id):null;
      if(pm && ['approved','sent'].includes(pm.status)) continue;   // đã duyệt/gửi → bỏ qua
      if(inp.checked){
        if(existed && existed.attendance==='absent') continue;       // đã nghỉ rồi
        const wasPresent=!!(existed && existed.attendance==='present');
        await DB.saveRecord({ session_id:GV.session.id, student_id:sid, attendance:'absent', created_by:STAFF.id });
        if(wasPresent) await DB.softUpdateSessionCount(sid,-1).catch(()=>{});
        nAbsent++;
      } else if(existed && existed.attendance==='absent'){
        await DB.deleteRecord(existed.id).catch(()=>{});   // bỏ tick → xoá bản ghi nghỉ, trả về "chưa chấm"
        nBack++;
      }
    }
    await DB.audit(CENTER.id, STAFF, 'attendance','session',GV.session.id,{absent:nAbsent});
    toast('✓ Đã điểm danh'+(nAbsent?` · ${nAbsent} bé nghỉ`:''));
    closeModal(); loadRoster();
  }catch(e){ toast('Lỗi: '+(e.message||e),'var(--primary-2)'); }
  finally{ saveQuickAttendance._busy=false; }
}

let SCORE = null;
let SCORE_DRAFTS = {};   // giữ nháp chấm dở theo (buổi|bé) — chống mất khi lỡ chạm nền
function _scoreKey(studentId){ return (GV.session?GV.session.id:'')+'|'+studentId; }
function _hasScoreWork(r){ return !!(r && ((r.strength&&r.strength.crit) || (r.improve&&r.improve.crit) || (r.strength&&r.strength.detail||'').trim() || (r.improve&&r.improve.detail||'').trim() || (r.observation||'').trim())); }
async function openScore(studentId){
  const stu = await DB.getStudent(studentId);
  const rec = await DB.getRecord(GV.session.id, studentId) || { attendance:'present', observation:'', mood:'normal', strength:null, improve:null };
  // nếu CSKH đã trả lại → lấy lý do để GV biết cần chỉnh gì
  let returnReason='';
  if(rec.id){ try{ const m=await DB.getMessage(rec.id); if(m && m.status==='returned') returnReason=m.return_reason||''; }catch(_){} }
  // khôi phục nháp chấm dở (nếu trước đó lỡ đóng giữa chừng)
  const draft = SCORE_DRAFTS[_scoreKey(studentId)];
  SCORE = { stu, rec: draft ? JSON.parse(JSON.stringify(draft)) : JSON.parse(JSON.stringify(rec)), returnReason };
  renderScore();
}
function renderScore(){
  const {stu, rec} = SCORE;
  const absent = rec.attendance==='absent';

function _nextTodoId(exceptId){ const r=(GV.roster||[]).find(x=>x.cat==='todo' && x.stu.id!==exceptId); return r?r.stu.id:null; }
async function saveScore(advance){
  if (saveScore._busy) return;                       // chống bấm đúp tạo bản ghi trùng
  const rec = SCORE.rec, stu = SCORE.stu;
  // validate TRƯỚC khi khoá busy (để còn bấm lại sau khi sửa)
  if (rec.attendance==='present'){
    syncScoreForm();
    if(!(rec.strength && rec.strength.crit && rec.strength.sentence)){ toast('Chọn 1 tiêu chí ĐIỂM MẠNH + câu mô tả','var(--primary-2)'); return; }
    if(!(rec.improve && rec.improve.crit && rec.improve.sentence)){ toast('Chọn 1 tiêu chí CẦN CẢI THIỆN + câu mô tả','var(--primary-2)'); return; }
  }
  saveScore._busy = true;
  try {
    const existed = await DB.getRecord(GV.session.id, stu.id);
    // chặn ghi đè tin đã duyệt/đã gửi (SO_TAY mục 7)
    if (existed){
      const pm = await DB.getMessage(existed.id);
      if (pm && ['approved','sent'].includes(pm.status)){
        toast('Buổi này đã được CSKH duyệt — liên hệ CSKH để mở lại','var(--primary-2)');
        return;
      }
    }
    const wasPresent = !!(existed && existed.attendance === 'present');
    const saved = await DB.saveRecord({
      session_id: GV.session.id, student_id: stu.id, attendance: rec.attendance,
      strength: rec.strength, improve: rec.improve,
      mood: rec.mood, created_by: STAFF.id,
    });
    await DB.audit(CENTER.id, STAFF, 'score', 'record', saved.id, {student:stu.name});

    // đếm buổi: chỉ đổi khi trạng thái present thay đổi (chống tăng trùng + có giảm)
    if (rec.attendance === 'present' && !wasPresent) await DB.softUpdateSessionCount(stu.id, +1).catch(()=>{});
    if (rec.attendance === 'absent'  &&  wasPresent) await DB.softUpdateSessionCount(stu.id, -1).catch(()=>{});

    delete SCORE_DRAFTS[_scoreKey(stu.id)];          // đã lưu → bỏ nháp dở
    SCORE = null;                                     // tránh closeModal lưu lại nháp

    if (rec.attendance==='absent') toast('✓ Đã ghi nhận bé nghỉ');
    else { await generateForRecord(saved, stu); toast('✓ Đã lưu & sinh nháp → chuyển CSKH'); }

    await loadRoster();                               // cập nhật danh sách (sau lưng modal)
    if (advance){
      const nextId=_nextTodoId(stu.id);
      if (nextId){ openScore(nextId); return; }       // nhảy thẳng bé chưa chấm kế tiếp
      toast('🎉 Đã chấm xong cả lớp!','var(--green)');
    }
    closeModal();
  } catch(e){
    toast('Lỗi khi lưu: '+(e.message||e),'var(--primary-2)');
  } finally {
    saveScore._busy = false;
  }
}

async function generateForRecord(rec, stu){

async function maybeDraftProfile(stu){
  const prof = await DB.getProfile(stu.id);
  if (prof && prof.status==='active') return;
  // gom tất cả record present của bé
  const allSessions = await DB._allSessionsOfStudent(stu.id);
  if (allSessions.length < 3) {
    if (!prof) await DB.saveProfile({student_id:stu.id, status:'observing'});
    return;
  }
  const inferred = ENG.inferProfile(allSessions);
  await DB.saveProfile({
    student_id: stu.id, status:'draft', introversion: inferred.introversion,
    learning_style: inferred.learning_style, concerns: inferred.concerns,
    summary: inferred.summary, generated_at: new Date().toISOString(),
  });
  await DB.audit(CENTER.id, STAFF, 'profile_draft','profile',stu.id,{student:stu.name});
}

/* ═══════════════════════════════════════════════════════════
   BÁO CÁO TUẦN (nội dung bài học từ thư viện + nhận xét)

let WK = { classId:'', program:'', book:'', week:1, from:'', to:'', childComments:{}, digests:{}, made:[], sessionPick:{}, stats:{total:0,ready:0,empty:0,sessions:0}, generating:false };
/* ── Thư viện giáo án: seed (lessons.js) + DB cloud + local fallback ── */
const LIB = {
  KEY:'ctrc:lessons:v1', db:{}, loaded:false,
  imported(){ try{ return JSON.parse(localStorage.getItem(this.KEY))||{}; }catch(_){ return {}; } },
  async load(centerId){
    this.db={};
    try{
      const rows = await DB.listLessons(centerId);
      rows.forEach(r=>{
        const sk = r.skeleton || {};
        this.db[r.key] = Object.assign({}, sk, {
          key:r.key, code:r.code, week:+r.week, title:r.title||sk.title||'',
          source:r.source||sk.source||'db', manager_summary:r.manager_summary||sk.manager_summary||'',
          parent_content:r.parent_content||sk.parent_content||'', raw_text:r.raw_text||sk.raw_text||'',
          saved_to_db:true,
        });
      });
      this.loaded=true;
    }catch(e){ console.warn('lesson library db load failed', e); this.loaded=false; }
  },
  all(){ return Object.assign({}, window.CTRC_LESSONS||{}, this.imported(), this.db); },
  async save(map){
    const list=Object.entries(map).map(([key,l])=>Object.assign({key},l));
    if(CENTER && DB.upsertLessons){
      await DB.upsertLessons(CENTER.id, list, STAFF&&STAFF.id);
      await this.load(CENTER.id);
    } else {
      const cur=this.imported(); Object.assign(cur, map); localStorage.setItem(this.KEY, JSON.stringify(cur));
    }
  },
  async remove(key){
    if(CENTER && DB.deleteLesson){ await DB.deleteLesson(CENTER.id, key); await this.load(CENTER.id); }
    const cur=this.imported(); if(cur[key]){ delete cur[key]; localStorage.setItem(this.KEY, JSON.stringify(cur)); }
  },
};
function LESSONS(){ return LIB.all(); }
function lessonKey(book, week){ return (book||'').trim() + '-w' + week; }
function lessonByKey(key){ return LESSONS()[key]; }
function bookCodes(){ const set=new Set(); Object.values(LESSONS()).forEach(l=>set.add(l.code)); return Array.from(set).sort(); }
/* mã + tuần từ tên file: 207w1 / 207w 2 / 210+-w1 / 205 Plus -w1 */
function codeWeekFromName(fname){
  const base=(fname||'').replace(/\.docx$/i,'');
  const m=base.match(/(\d+)\s*(\+|plus)?[^0-9]*w\s*([1-4])/i);
  if(!m) return null;
  return { code:m[1]+(m[2]?'+':''), week:+m[3] };
}
function codeFromName(fname){
  const base=(fname||'').replace(/\.docx$/i,'');
  const ms=Array.from(base.matchAll(/(\d+)\s*(\+|plus)?/ig));
  if(!ms.length) return '';
  const m=ms[ms.length-1];
  return m[1]+(m[2]?'+':'');
}
function lessonWeeksFromDocText(text, code, forcedWeek){
  if(forcedWeek){
    const lesson=parseLessonText(text, code, forcedWeek);
    lesson.sessions=1;
    lesson.session_numbers=[];
    lesson.session_range='Tuần '+forcedWeek;
    lesson.session_items=[sessionItemFromText(null, text, code, forcedWeek)];
    return [{ key:code+'-w'+forcedWeek, lesson }];
  }
  const raw=(text||'').replace(/\r/g,'');
  const parts=[]; const re=/\b(?:L\s*)?\d+\s*(?:\+)?\s*[-–]?\s*BU[ỔO]I\s*(\d+)/ig;
  let m, last=null;
  while((m=re.exec(raw))){
    if(last) parts.push({buoi:last.buoi, text:raw.slice(last.idx, m.index)});
    last={buoi:+m[1], idx:m.index};
  }
  if(last) parts.push({buoi:last.buoi, text:raw.slice(last.idx)});
  if(!parts.length){
    const lesson=parseLessonText(text, code, 1);
    lesson.sessions=1;
    lesson.session_numbers=[];
    lesson.session_range='Tuần 1';
    lesson.session_items=[sessionItemFromText(null, text, code, 1)];
    return [{ key:code+'-w1', lesson }];
  }
  const byWeek={};
  parts.forEach(p=>{ const w=Math.max(1, Math.ceil((p.buoi||1)/2)); (byWeek[w]=byWeek[w]||[]).push(p); });
  return Object.keys(byWeek).sort((a,b)=>+a-+b).map(w=>{
    const items=byWeek[w].sort((a,b)=>(a.buoi||0)-(b.buoi||0));
    const lesson=parseLessonText(items.map(p=>p.text).join('\n'), code, +w);
    lesson.sessions=items.length;
    lesson.session_numbers=items.map(p=>p.buoi).filter(Boolean);
    lesson.session_range=lesson.session_numbers.length?'Buổi '+lesson.session_numbers.join(' & '):'Buổi '+((+w-1)*2+1)+'-'+(+w*2);
    lesson.session_items=items.map(p=>sessionItemFromText(p.buoi, p.text, code, +w));
    lesson.title=lesson.title || `Giáo án ${code} · Tuần ${w}`;
    return { key:code+'-w'+w, lesson };
  });
}
function sessionItemFromText(no, text, code, week){
  const p=parseLessonText(text, code, week);
  const firstPage=(p.pages||[])[0];
  const summary=(p.knowledge || (firstPage&&firstPage.desc) || (p.body||[]).find(x=>x.length>18) || '').replace(/\s+/g,' ').trim();
  return { no, title:p.title||'', skill:p.skill||'', pages:p.pages||[], summary:summary.slice(0,180) };
}
function _normType(t){ const l=(t||'').toLowerCase(); const M={'cơ bản':'Tư duy cơ bản','toán':'Tư duy toán học','logic':'Tư duy logic','sáng tạo':'Tư duy sáng tạo','vận động':'Vận động'}; for(const k in M){ if(l.includes(k)) return M[k]; } return (t||'').trim(); }
/* parse text giáo án 1 tuần (port parse_lessons.py) */
function parseLessonText(text, code, week){
  const lines=(text||'').split('\n').map(l=>l.trim()).filter(Boolean);
  const isBoiler=p=>{ const low=p.toLowerCase();
    if(low.startsWith('(ngày')) return true;
    if(/^l[ớo]p\s*:?\s*$/.test(low)) return true;
    if(/^b[àa]i\s*h[ọo]c\s*:\s*\d+\+?\s*[-–]?\s*tu[ầa]n/.test(low)) return true;
    return ['báo cáo tình hình','kính gửi','chương trình: ucrea','hôm nay, em/cô/thầy','dưới đây là phần nhận xét','hẹn gặp lại','một số hình ảnh'].some(b=>low.includes(b));
  };
  const body=lines.filter(l=>!isBoiler(l));
  let title='', skill=''; const knowledge=[]; const pages=[];
  for(const p of lines){
    let m;
    if((m=p.match(/^B[àa]i\s*h[ọo]c\s*:\s*(.+)$/)) && !/tu[ầa]n\s*\d/i.test(m[1]) && !title){ title=m[1].trim(); continue; }
    if((m=p.match(/^M[ụu]c\s*ti[êe]u\s*k[ỹy]\s*n[ăa]ng\s*:?\s*(.*)$/i))){ skill=m[1].trim(); continue; }
    if((m=p.match(/^M[ụu]c\s*ti[êe]u\s*(.+)$/i))){ knowledge.push(p.trim()); continue; }
    if((m=p.match(/^Trang\s*([0-9][0-9\s+\-,–]*?)\s*:\s*(.+)$/))){
      const rng='Trang '+m[1].replace(/\s+/g,' ').trim(); const rest=m[2].trim();
      const ci=rest.indexOf(':');
      if(ci>=0) pages.push({range:rng,type:_normType(rest.slice(0,ci)),desc:rest.slice(ci+1).trim()});
      else pages.push({range:rng,type:'',desc:rest});
      continue;
    }
  }
  return { code, week, title, knowledge:knowledge.join('\n'), skill, pages, body, raw_text:body.join('\n'), source:'imported' };
}
function _sundayStr(mondayStr){ const d=new Date(mondayStr); d.setDate(d.getDate()+6); return d.toISOString().slice(0,10); }

async function importLessons(){
  const inp=$('#lib-files'); const files=Array.from(inp.files||[]);
  if(!files.length){ toast('Chọn file .docx trước','var(--primary-2)'); return; }
  const useAI=$('#lib-ai').checked && AI.usable();
  const stage=$('#lib-stage'); stage.innerHTML='<p class="hint" style="margin-top:10px">Đang đọc file…</p>';
  try{ if(!window.mammoth) await _loadScript('https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js'); }
  catch(e){ stage.innerHTML='<p class="voice-warn">Không tải được thư viện đọc docx (cần mạng).</p>'; return; }
  const staged={}; const errs=[];
  for(const f of files){
    const cw=codeWeekFromName(f.name), code=(cw&&cw.code)||codeFromName(f.name);
    if(!code){ errs.push(f.name+' (tên thiếu mã cuốn/bài)'); continue; }
    try{ const buf=await f.arrayBuffer(); const res=await window.mammoth.extractRawText({arrayBuffer:buf});
      lessonWeeksFromDocText(res.value, code, cw&&cw.week).forEach(({key,lesson})=>{ staged[key]=lesson; });
    }catch(e){ errs.push(f.name+' ('+(e.message||'lỗi')+')'); }
  }
  if(useAI){
    const ks=Object.keys(staged); let done=0;
    for(const k of ks){ stage.innerHTML='<p class="hint" style="margin-top:10px">✨ AI đang đọc & tóm tắt '+(done+1)+'/'+ks.length+'…</p>';
      try{ Object.assign(staged[k], await enrichLesson(staged[k])); }catch(_){} done++; }
  }
  LIBV.staged=staged; renderStage(staged, errs);
}
function renderStage(staged, errs){
  const stage=$('#lib-stage'); if(!stage)return;
  const keys=Object.keys(staged).sort((a,b)=>lessonSortKey(a).localeCompare(lessonSortKey(b), undefined, {numeric:true}));
  stage.innerHTML = `<div style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px">
    <div class="ed-head" style="margin-bottom:6px"><span>Sơ đồ giáo án: file → buổi → tuần → tổng hợp</span><span class="cc">${keys.length} tuần</span></div>
    ${errs.length?`<p class="voice-warn">Bỏ qua: ${errs.map(esc).join('; ')}</p>`:''}
    ${renderLessonImportDiagram(staged, keys)}

      <button class="btn ghost sm" onclick="CTRC.cancelStage()">Huỷ</button>
      <button class="btn primary sm" onclick="CTRC.saveStage()">💾 Lưu ${keys.length} tuần vào thư viện</button>
    </div></div>`;
}
function lessonSortKey(k){ const m=String(k).match(/^(.*)-w(\d+)$/); return m ? m[1].padStart(8,'0')+'-'+String(+m[2]).padStart(2,'0') : String(k); }
function renderLessonImportDiagram(map, keys){
  const groups={}; keys.forEach(k=>{ const l=map[k]||{}; const code=l.code || String(k).split('-w')[0]; (groups[code]=groups[code]||[]).push(k); });
  return Object.keys(groups).sort((a,b)=>a.localeCompare(b, undefined, {numeric:true})).map(code=>`

  </div>`;

function lessonDigest(l){
  const parts=[];
  if(l.knowledge) parts.push(l.knowledge);
  if(l.skill) parts.push('Mục tiêu kỹ năng: '+l.skill);
  (l.pages||[]).slice(0,2).forEach(p=>parts.push([p.range,p.type,p.desc].filter(Boolean).join(': ')));
  return parts.join(' ').replace(/\s+/g,' ').trim();
}

async function enrichLesson(rec){
  const skill = AI._rules.giaoan || '';
  const sys = AI._sysFor('generic', 'Bạn đọc giáo án mầm non, trả JSON thuần.');
  const prompt = (skill?skill+'\n\n':'')+reportConfigPrompt(CENTER&&CENTER.report_config)+'\n\n'+`GIÁO ÁN (mã ${rec.code} tuần ${rec.week}):\n"""${(rec.body||[]).join('\n')}"""\n\nTrả về DUY NHẤT JSON: {"title":"...","manager_summary":"...","parent_content":"..."}.`;
  const text=await AI.complete(sys, prompt);
  const m=text.match(/\{[\s\S]*\}/); const out=m?JSON.parse(m[0]):{};
  const r={};
  if(out.manager_summary) r.manager_summary=out.manager_summary;
  if(out.parent_content) r.parent_content=out.parent_content;
  if(out.title && !rec.title) r.title=out.title;
  return r;
}

function _clipLessonBit(s, n=86){ s=String(s||'').replace(/\s+/g,' ').trim(); if(s.length<=n) return s; let t=s.slice(0,n); const sp=t.lastIndexOf(' '); if(sp>35) t=t.slice(0,sp); return t+'…'; }
function _lessonNarrativeHint(snap){
  if(!snap) return '';
  const range=snap.session_range || ((snap.session_numbers||[]).length?'Buổi '+snap.session_numbers.join(' & '):'');
  const acts=(snap.session_items||[]).map(si=>si.summary||si.title||si.skill).filter(Boolean).slice(0,2).map(x=>_clipLessonBit(x,70));
  if(!acts.length && snap.pages&&snap.pages.length) snap.pages.slice(0,2).forEach(p=>acts.push(_clipLessonBit(p.desc||p.type||'',70)));
  return [range, acts.length?('các hoạt động như '+acts.join('; ')):''].filter(Boolean).join(', ');
}
function _contextualizeFallbackNarrative(nar, snap){
  const hint=_lessonNarrativeHint(snap);
  if(!nar || !hint) return nar;
  if(nar.tongHop && !/hoạt động|bài học|buổi/.test(nar.tongHop)) nar.tongHop += ' Các quan sát này được ghi nhận trong '+hint+'.';
  else if(nar.tongHop) nar.tongHop += ' Ngữ cảnh bài học: '+hint+'.';
  if(nar.coGang && !/hoạt động|bài học|buổi/.test(nar.coGang)) nar.coGang += ' Cô sẽ tiếp tục hỗ trợ con trong những hoạt động cùng mạch bài học này.';
  return nar;
}

  const lessonAI = (les || objText) ? {

function _dateLabel(from,to){ return ENG.fmtDate(from)+' – '+ENG.fmtDate(to); }
function _reEsc(s){ return String(s||'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function _lcFirst(s){ return s ? s.charAt(0).toLowerCase() + s.slice(1) : s; }
function _personalizeLessonForChild(text, name){
  let t=(text||'').trim(); const n=(name||'con').trim();
  if(!t) return '';
  t=t.replace(/^Tuần này,\s*các con\s+được/i, `Tuần này, ${n} được`);
  t=t.replace(/^Tuần này,\s*các con\s+/i, `Tuần này, ${n} `);
  t=t.replace(/^Các con\s+được/i, `${n} được`);
  t=t.replace(/^Các con\s+/i, `${n} `);
  t=t.replace(/^Con\s+/i, `${n} `);
  const hasName = n && new RegExp(_reEsc(n), 'i').test(t);
  if(!hasName && !/^Tuần này/i.test(t)) t = `Tuần này, ${n} được ${_lcFirst(t)}`;
  return t;
}

function _wkGrow(el){ el.style.height='auto'; el.style.height=(el.scrollHeight+2)+'px'; }
function _readWkEdit(wid){
  const box=document.querySelector('.wk-edit[data-wid="'+wid+'"]'); if(!box) return null;
  const o={summary:{}};
  box.querySelectorAll('textarea').forEach(t=>{ const f=t.dataset.f; if(f==='child_comment') o.child_comment=t.value.trim(); else o.summary[f]=t.value.trim(); });

}
/* gộp chỉnh sửa trong ô textarea vào bản ghi (in-memory) — để copy/ảnh luôn khớp text mới nhất */
function _wkApplyEdits(weeklyId){
  const m=WK.made.find(x=>x.w.id===weeklyId); if(!m) return null;

async function saveWeeklyEdit(weeklyId){

function _loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('Không tải được '+src)); document.head.appendChild(s); }); }

let Q = { tab:'pending', classId:'', search:'', items:[], classes:[] };
function _hoursSince(iso){ if(!iso) return 0; return (Date.now()-new Date(iso).getTime())/3600000; }
function timeAgo(iso){
  if(!iso) return '';
  const m=(Date.now()-new Date(iso).getTime())/60000;
  if(m<1) return 'vừa xong'; if(m<60) return Math.round(m)+' phút trước';
  const h=m/60; if(h<24) return Math.round(h)+' giờ trước';
  return Math.round(h/24)+' ngày trước';
}
function _qCat(m){ return ['waiting_cs','cs_editing','ai_writing'].includes(m.status)?'pending':(m.status==='returned'?'returned':(m.status==='approved'?'approved':(m.status==='sent'?'sent':(m.status==='error'?'error':'other')))); }

function qTab(t){ Q.tab=t; renderQueue(); }
async function loadQueue(){
  const box=$('#q-list'); if(box) box.innerHTML=skeletonList(5);
  const studs = await DB.listStudents(CENTER.id);
  const sMap={}; studs.forEach(s=>sMap[s.id]=s);
  if(!Q.classes.length) Q.classes = await DB.listClasses(CENTER.id);
  const cMap={}; Q.classes.forEach(c=>cMap[c.id]=c.name);
  const all = await DB.listMessages(CENTER.id);
  Q.items = all.map(m=>{ const stu=sMap[m.student_id]||{}; return {m, stu, className:cMap[stu.class_id]||''}; });
  renderQueue();

function renderQueue(){
  const counts={pending:0,returned:0,approved:0,sent:0,error:0};
  Q.items.forEach(it=>{ const c=_qCat(it.m); if(counts[c]!=null) counts[c]++; });
  const tb=$('#q-tabs');
  if(tb){
    const T=[['pending','Chờ duyệt'],['returned','Đã trả lại GV'],['approved','Đã duyệt'],['sent','Đã gửi'],['error','Lỗi']];
    tb.innerHTML=T.map(([k,l])=>`<button class="btn sm ${Q.tab===k?'primary':''}" onclick="CTRC.qTab('${k}')">${l} (${counts[k]})</button>`).join('');
  }
  const box=$('#q-list'); if(!box) return;
  const q=(Q.search||'').toLowerCase().trim();
  let list=Q.items.filter(it=> _qCat(it.m)===Q.tab
    && (!Q.classId || it.stu.class_id===Q.classId)
    && (!q || (it.stu.name||'').toLowerCase().includes(q)));
  if(Q.tab==='pending') list.sort((a,b)=> (a.m.created_at||'') < (b.m.created_at||'') ? -1:1);   // cũ nhất trước (SLA)
  else list.sort((a,b)=> (a.m.updated_at||'') > (b.m.updated_at||'') ? -1:1);                      // mới nhất trước
  box.innerHTML = list.map(it=>{
    const m=it.m, st=STATUS[m.status]||['',''];
    const overdue = Q.tab==='pending' && _hoursSince(m.created_at) >= 2;
    return `<div class="stu-row ${overdue?'overdue':''}" onclick="CTRC.openMsg('${m.id}')">
      ${avatar(it.stu)}
      <span class="nm">${esc(it.stu.name||'?')}<small>${esc(it.className)}${it.className?' · ':''}${esc((m.diem_manh||'').slice(0,40))}…</small>${phoneChip(it.stu)?`<div style="margin-top:5px">${phoneChip(it.stu)}</div>`:''}</span>
      <span class="q-right">
        <span class="badge ${st[1]}">${st[0]}</span>
        <span class="sla ${overdue?'over':''}">${overdue?'⏰ ':''}${esc(timeAgo(m.created_at))}</span>
        ${Q.tab==='pending'?`<button class="btn green sm" style="padding:7px 10px" onclick="CTRC.quickApprove('${m.id}',event)" title="Duyệt nhanh (tin đã đạt chuẩn)">✓ Duyệt nhanh</button>`:''}
      </span></div>`;
  }).join('') || (function(){
      const empt={pending:['📭','Không có tin chờ duyệt','Tin giáo viên gửi lên sẽ hiện ở đây.'],
        returned:['↩️','Chưa trả lại tin nào',''],approved:['✅','Chưa có tin đã duyệt',''],
        sent:['📨','Chưa gửi tin nào',''],error:['⚠️','Không có tin lỗi','']}[Q.tab]||['📭','Trống',''];
      return emptyState(empt[0], (Q.classId||q)?'Không có tin khớp bộ lọc':empt[1], (Q.classId||q)?'':empt[2]);
    })();
}

let MSG = null;
async function openMsg(id){
  const m = await DB.getMessageById(id);
  if (!m){ toast('Tin không còn tồn tại — tải lại danh sách','var(--primary-2)'); loadQueue(); return; }
  const stu = await DB.getStudent(m.student_id);
  // ngày buổi học thật + record (để hiện ngữ cảnh)
  let date = todayStr(); let rec = null;
  try { rec = await DB._getRecordById(m.record_id); if(rec){ const ses = await DB._getSessionById(rec.session_id); if(ses) date = ses.date; } } catch(_){}
  MSG = { m, stu, date, rec };
  EDITING_MSG = null;
  if (m.status==='waiting_cs'){
    try { const upd = await DB.updateMessageGuarded(m.id, m.version, {status:'cs_editing', lock_owner:STAFF.id, lock_at:new Date().toISOString()}); MSG.m = upd; EDITING_MSG = m.id; }
    catch(e){ toast(e.message,'var(--primary-2)'); }
  } else if (m.status==='cs_editing'){
    if (m.lock_owner === STAFF.id){ EDITING_MSG = m.id; }          // lấy lại lock của chính mình
    else if (m.lock_owner){
      const mins = m.lock_at ? Math.round((Date.now()-new Date(m.lock_at))/60000) : 99;
      if (mins<5) toast('⚠ Tin đang được thành viên khác mở sửa','var(--primary-2)');
      else { // lock cũ >5' → tiếp quản
        try { const upd = await DB.updateMessageGuarded(m.id, m.version, {lock_owner:STAFF.id, lock_at:new Date().toISOString()}); MSG.m = upd; EDITING_MSG = m.id; } catch(_){}
      }
    }
  }
  renderMsg();
}

function MSG_DATE(){ return (MSG && MSG.date) || todayStr(); }
/* CSKH duyệt nhanh ngay trên hàng đợi — chỉ áp tin ĐÃ ĐẠT (đủ 2 dòng + không từ cấm); tin cần sửa thì mở ra */
async function quickApprove(id, ev){
  if(ev) ev.stopPropagation();
  if(quickApprove._busy) return; quickApprove._busy=true;
  try{
    const m=await DB.getMessageById(id); if(!m){ toast('Tin không còn','var(--primary-2)'); loadQueue(); return; }
    const v=ENG.checkVoice([m.diem_manh||'',m.co_gang||''].join(' '));
    if(!m.diem_manh||!m.co_gang||!v.ok){ toast('Tin cần xem lại trước khi duyệt'+(v.ok?'':' (có từ nên tránh)'),'var(--primary-2)'); openMsg(id); return; }
    if(['approved','sent'].includes(m.status)){ toast('Tin đã duyệt rồi'); loadQueue(); return; }
    const upd=await DB.updateMessageGuarded(m.id, m.version, {status:'approved', approved_by:STAFF.id, approved_at:new Date().toISOString(), edited_by:STAFF.id, lock_owner:null, lock_at:null});
    let tok=await DB.getExistingToken(m.id); if(!tok) await DB.createParentToken(m.id);
    await DB.audit(CENTER.id, STAFF, 'approve','message',m.id,{quick:true});
    toast('✓ Đã duyệt nhanh'); loadQueue();
  }catch(e){ toast(e.message,'var(--primary-2)'); }
  finally{ quickApprove._busy=false; }
}

function _autogrow(el){ el.style.height='auto'; el.style.height=(el.scrollHeight+2)+'px'; }
/* gõ trong editor: auto-grow + đếm ký tự + đo độ dài Zalo + check giọng */
function edInput(el){

}
function readEdits(){
  return { diem_manh:($('#m-dm')||{}).value?.trim()||'', co_gang:($('#m-cg')||{}).value?.trim()||'' };
}
function voiceCheck(){
  const dm=($('#m-dm')||{}).value||'', cg=($('#m-cg')||{}).value||'';
  // đếm ký tự từng dòng
  const set=(id,v)=>{ const e=$(id); if(e) e.textContent=v+' ký tự'; };
  set('#cc-dm', dm.length); set('#cc-cg', cg.length);
  // đo tổng (ước lượng độ dài tin Zalo, mục tiêu gọn ~280)
  const meter=$('#zalo-meter');
  if(meter){
    const total = dm.length+cg.length;
    const ok = total<=320;
    meter.className = 'zalo-meter '+(ok?'zalo-ok':'zalo-long');
    meter.innerHTML = `<span>📨 Tổng nội dung: <b>${total}</b> ký tự</span><span>${ok?'✓ Gọn, vừa 1 tin Zalo':'Hơi dài — cân nhắc rút gọn cho dễ đọc'}</span>`;
  }
  // check giọng thương hiệu
  const w=$('#voice-warn');
  if(w){
    const r = ENG.checkVoice([dm,cg].join(' '));
    w.textContent = r.ok ? '' : '⚠ Có từ nên tránh theo giọng thương hiệu: '+r.banned.join(', ');
  }
}
async function regen(){
  const rec = await DB._getRecordById(MSG.m.record_id);
  const stu = MSG.stu;
  const theme = await DB.getThemeFor(CENTER.id, todayStr());
  const profile = await DB.getProfile(stu.id);
  const out = ENG.generate({student:stu,record:rec,theme,profile:(profile&&profile.status==='active')?profile:null,date:todayStr()});
  Object.assign(MSG.m,{diem_manh:out.diem_manh,co_gang:out.co_gang,goi_y:out.goi_y,ai_draft:out,source:'engine',featured_strength:out.featured_strength});

  const cg = grab(/(?:cố gắng|🎯)[:\-–]?\s*([\s\S]*?)$/i);
  if (dm||cg){
