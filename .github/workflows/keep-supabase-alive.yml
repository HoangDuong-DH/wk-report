# ═══════════════════════════════════════════════════════════════════════════
#  GIỮ SUPABASE KHỎI BỊ "NGỦ" (keep-alive) — chi phí $0
#  ───────────────────────────────────────────────────────────────────────────
#  VÌ SAO CÓ FILE NÀY:
#    Supabase gói FREE tự PAUSE dự án khi ~7 ngày không có request nào.
#    Khi bị pause, domain <ref>.supabase.co biến mất khỏi DNS → app CTRC
#    không vào được dữ liệu (đã xảy ra 25/07/2026, phải Restore bằng tay).
#    Job này gọi 1 câu đọc nhẹ mỗi ngày → dự án luôn được coi là "đang dùng".
#
#  KIÊM LUÔN GIÁM SÁT:
#    Nếu Supabase chết/pause/hết hạn key, job FAIL → GitHub tự gửi email cho
#    chủ repo. Tức là biết TRƯỚC khi giáo viên phát hiện app trắng màn.
#
#  KHÔNG CẦN SECRET:
#    URL + anon key đọc thẳng từ ctrc/config.js (2 giá trị này vốn đã công khai
#    theo thiết kế — RLS mới là lớp bảo vệ). Xoay key thì job tự dùng key mới.
#
#  ⚠️ LƯU Ý VẬN HÀNH: GitHub tự TẮT workflow theo lịch nếu repo không có hoạt
#    động nào trong 60 ngày (sẽ có email cảnh báo, bật lại bằng 1 cú bấm ở
#    tab Actions). Nghỉ dài (hè/Tết) thì để ý email này.
#
#  Chạy thử tay: tab Actions → chọn workflow này → "Run workflow".
# ═══════════════════════════════════════════════════════════════════════════
name: keep-supabase-alive

on:
  schedule:
    # 02:17 UTC hằng ngày ≈ 09:17 giờ Việt Nam. Lệch phút để né giờ cao điểm của GitHub.
    - cron: '17 2 * * *'
  workflow_dispatch:        # cho phép bấm chạy tay

# chỉ cần đọc code trong repo, không ghi gì
permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Lấy code (để đọc ctrc/config.js)
        uses: actions/checkout@v4

      - name: Đọc URL + anon key từ ctrc/config.js
        id: cfg
        run: |
          set -euo pipefail
          URL=$(grep -oE 'https://[a-z0-9]+\.supabase\.co' ctrc/config.js | head -1 || true)
          KEY=$(grep -oE 'eyJ[A-Za-z0-9_.-]{60,}' ctrc/config.js | head -1 || true)
          if [ -z "$URL" ]; then
            echo "::error::Không tìm thấy supabaseUrl trong ctrc/config.js — app đang chạy demo mode?"
            exit 1
          fi
          if [ -z "$KEY" ]; then
            echo "::error::Không tìm thấy anon key trong ctrc/config.js"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "Sẽ ping: $URL"

      - name: Ping Supabase (đọc thật 1 dòng bảng centers)
        run: |
          set -euo pipefail
          URL='${{ steps.cfg.outputs.url }}'
          KEY='${{ steps.cfg.outputs.key }}'
          # thử tối đa 3 lần, cách nhau 20s — né lỗi mạng nhất thời của runner
          for i in 1 2 3; do
            CODE=$(curl -s -o /tmp/out.json -w '%{http_code}' --max-time 25 \
              "$URL/rest/v1/centers?select=id&limit=1" \
              -H "apikey: $KEY" -H "Authorization: Bearer $KEY" || echo "000")
            echo "Lần $i → HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "✅ Supabase còn sống, dự án được giữ 'thức'."
              head -c 200 /tmp/out.json || true
              exit 0
            fi
            [ $i -lt 3 ] && sleep 20 || true
          done
          echo "::error::Không gọi được Supabase (HTTP $CODE). Khả năng dự án bị PAUSE/xoá hoặc key hết hạn."
          echo "::error::Kiểm tra https://supabase.com/dashboard — nếu Paused thì bấm Restore."
          echo "--- phản hồi (nếu có) ---"
          head -c 400 /tmp/out.json || true
          exit 1
